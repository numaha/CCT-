知のネットワークに接続するための最も安全な方法を採用したいと考えています。\n\nRevoMedia は次のうちどれを採用する必要がありますか。","c":["Bluetoothペアリング","仮想プライベートネットワーク (VPN) 接続","USBテザリング","直接Wi-Fi接続"],"a":[1],"h":"","p":false,"cat":"無線・モバイル・IoT","g":"モバイル管理","x":"未知のネットワークに接続する際に最も安全なのは、VPNで通信を暗号化することです。"},{"id":132,"q":"あなたは、会計部門の会社のラップトップが紛失した事件を扱うために、コンピュータフォレンジック調査員として呼び出されました。このラップトップには、機密の財務データが含まれていました。会社は、データ漏洩の可能性を疑い、紛失したデバイスから証拠を回収したいと考えています。\n\nデジタル証拠に関して、最も重要な最初のアクションは何ですか?","c":["ラップトップの電源をオンにし（見つかった場合）、削除されたファイルを検索します","紛失したラップトップの使用状況を把握するために、会社の担当者にインタビューします。","事件を直ちに警察に報告してください。","ラップトップが最後に目撃された現場を確保します（可能であれば）。"],"a":[3],"h":"","p":false,"cat":"フォレンジック","g":"証拠の扱い","x":"紛失・盗難の最初の対応は、可能なら最後に目撃された現場を確保して証拠を保全することです。"},{"id":133,"q":"組織の機密情報を含むテキストファイルが漏洩し、組織の評判を落とすために改ざんされました。安全対策として、組織は元のファイルの MD5ハッシュを格納していました。漏洩したファイルは、整合性を検査するために保持されています。「Sensitiveinfo.txt」という名前のファイルは、OriginalFileHash.txtとともに、攻撃者マシン 1 のドキュメントの Hashという名前のフォルダーに保存されています。元のファイルのハッシュ値と漏洩したファイルを比較し、はいまたはいいえを選択して、ファイルが改ざんされているかどうかを記述します。★","c":["いいえ","はい"],"a":[1],"h":"lab12-1\n●回答方法\n「HashCalc」を起動。※デスクトップになければ、\nZ:\\CCT-Tools\\CCT Module 14 Cryptografhy\\MD5 and MD6 Hash Calculators\\HashCalc\n内の「setup.exe」からインストール。\n「HashCalc」を起動後、Data Formatは「File」。Dataの右「…」をクリック。\n「Sensitiveinfo.txt」を選択。再度デスクトップから「HashCalc」を起動し、\n次は、「OriginalFileHash.txt」を選択肢、両者比較。\n\nWindowsでハッシュ値を生成\ncertutil -hashfile ファイル名 [アルゴリズム]\n※アルゴリズムは、MD5、SHA256などを指定できる\n指定しなかった場合はSHA1で生成","p":true,"cat":"実技ラボ","g":"暗号・ハッシュ・ステガノ","x":"HashCalcまたはcertutil -hashfileで元ファイルと漏洩ファイルのハッシュを比較し、不一致なら改ざんあり(はい)です。"},{"id":134,"q":"プロのハッカーであるミゲルは、ある組織を標的にして、その組織の重要な情報に不正にアクセスしようとしました。彼は、ターゲットアプリケーションのデータを漏洩する可能性のあるエンドポイント通信の欠陥を特定しました。\n\n上記のシナリオでは、次の安全なアプリケーション設計原則のうち、アプリケーションが満たしていなかったものはどれですか?","c":["最も弱い部分を保護する","ユーザー入力を信頼しない","例外処理","フォールトトレランス"],"a":[2],"h":"","p":false,"cat":"アプリ・クラウド・仮想化","g":"安全なアプリ","x":"エンドポイント通信の欠陥による漏洩は『例外処理』原則の不足が原因です。"},{"id":135,"q":"プロのハッカーであるリチャードは、位置情報からユーザーのオフライン活動に関する機密データと情報を収集するために、マーケティング担当者に雇われました。リチャードは、GPS 機能を使用して、ユーザーのモバイルデバイスが正確な位置に近いかどうかを判断する手法を採用しました。この手法を使用して、リチャードは、静的な場所に仮想バリアを配置し、バリアを越えるモバイルユーザーと対話しました。\n\nこのシナリオでリチャードが使用した手法を特定してください。","c":["コンテナ化","無線（OTA）アップデート","完全なデバイス暗号化","ジオフェンシング"],"a":[3],"h":"","p":false,"cat":"無線・モバイル・IoT","g":"モバイル管理","x":"静的な場所に仮想バリアを設定し、境界を越えたユーザーを検知して対話する手法はジオフェンシングです。"},{"id":136,"q":"pfSense ファイアウォールは、Web アプリケーション www.abchacker.comをブロックするように設定されています。管理者が設定したルールを分析し、ルールを適用するために使用されたプロトコルを選択します。\n\nヒント: ファイアウォールのログイン資格情報は以下の通りです。ユーザー名: adminパスワード: admin@l23","c":["POP3","TCP/UDP","FTP","ARP"],"a":[1],"h":"lab5-4\n●回答方法\n管理者マシン？で\npfSense のWeb GUIにアクセス　\n「Firewall」メニューをクリックし、「Rules」オプションを選択。\n「LAN」タブをクリックし、LANインターフェースに適用されているルールを確認。\nwww.abchacker.comの対応(ブロック)ルールを確認。","p":true,"cat":"実技ラボ","g":"その他ラボ","x":"pfSenseのWeb GUIでFirewall > Rules > LANを開き、ブロックルールのプロトコルを確認します。"},{"id":137,"q":"カルビンは、組織内の物理的なファイル保管場所から短絡が原因で燃え盛る炎を発見しました。この事件に対応して、彼は消火システムを使用し、初期段階で事件を抑制し、広範囲に広がるのを防ぎました。\n\nこのシナリオでカルビンが使用した消火システムは次のどれですか。","c":["火災検知システム","スプリンクラーシステム","煙探知器","消火器"],"a":[3],"h":"","p":false,"cat":"物理セキュリティ","g":"物理セキュリティ対策","x":"電気ショートで発生した初期火災を抑えて拡大を防いだ=消火器による消火です。"},{"id":138,"q":"コンピューター ユーザーのポールは、オンラインアプリケーションを使用して同僚と情報を共有しました。ポールが使用したオンラインアプリケーションには、最新の暗号化メカニズムが組み込まれています。このメカニズムは、端から端まで移動しながら回転する特性を持つ一連の光子を使用してデータを暗号化します。これらの光子は、フィルター (垂直、水平、スラッシュ、バックスラッシュ)を通過する過程で形状を変え続けます。\n\n上記のシナリオで示された暗号化メカニズムを特定します。","c":["量子暗号","準同型暗号化","リベスト・シャミール・アデルマン暗号化","楕円曲線暗号"],"a":[0],"h":"","p":false,"cat":"暗号・署名","g":"暗号方式の使い分け","x":"光子の偏光(垂直・水平・斜め)を使ってデータを暗号化・鍵配送するのは量子暗号。観測すると状態が変わるため盗聴を検知できます。"},{"id":139,"q":"あなたは、Web 開発会社で働くハリスです。指定された IP アドレス 20.20.10.26の脆弱性評価のタスクを実行するよう割り当てられています。重大度に応じて、Webサイトに影響を与える可能性のある脆弱性を選択してください。★\n\nヒント: Greenbone Web 認証情報: admin/password","c":["TCPタイムスタンプ","匿名 FTP ログイン レポート","FTP 暗号化されていないクリアテキスト ログイン","UDPタイムスタンプ"],"a":[1],"h":"lab6-1\nlab6-4\n問題集では「FTP暗号化されていないクリアテキストログイン」が回答となっていた\n●回答方法\nAttacker Machineで\nデスクトップウィンドウ上部の「Applications」→「Pentesting」\n→「Vulnerability Analysis」→「Openvas - Greenbone」→「Start」でGreenboneを起動。\n→ログイン情報入力し、初期化を待つ。　sudo openvas-start\nFirefoxブラウザを起動し、https://127.0.0.1:9392と入力してGreenboneを起動。\n上部の「scans」タブ→「tasks」。左上の「魔法の杖」アイコンから「Task Wizard」を\n開き、対象のIPアドレスを入力し、「Start Scan」を押す。\n※スキャンには20分くらいかかる。。。\nスキャン後は、対象のステータスの「Done」をクリックし、「Results」タブを開く。\n→深刻度レベルは「中（Medium）」が正解かな？","p":true,"cat":"実技ラボ","g":"OpenVAS脆弱性スキャン","x":"Greenboneのスキャン結果で重大度の高い脆弱性を確認。重大度に応じて選ぶ問題。CSV正解は『匿名FTPログインレポート』(問題集は『FTP暗号化されていないクリアテキストログイン』と記載)。"},{"id":140,"q":"インシデント対応計画において、インシデント対応ライフサイクルのフェーズは何ですか?(該当するものをすべて選択してください)","c":["検出と分析","回復","予防","封じ込め"],"a":[0,1,3],"h":"","p":false,"cat":"インシデント対応","g":"IH&Rの段階","x":"IH&Rのライフサイクルは準備、検出と分析、封じ込め・根絶・回復、事後活動。『予防』は独立したフェーズではありません。"},{"id":141,"q":"組織のネットワーク スペシャリストである Camden は、制御室から SIFMを使用して組織のネットワークの動作を監視しました。SIEMは疑わしいアクティビティを検出し、カメラ aにアラートを送信しました。画面に表示されたインシデントの重大度に基づいて、Camdenは正しい判断を下し、攻撃者によるさらなる悪用を防ぐためにすぐに防御措置を開始しました。\n\n次の SIEM 機能のうち、Camden がセキュリティインシデント発生時に疑わしい動作を確認し、正しい判断を下すのに役立ったものはどれですか。","c":["アプリケーションログ監視","ログの保持","ダッシュボード","データ集約"],"a":[2],"h":"","p":false,"cat":"検知(IDS)・ログ・SIEM","g":"SIEM・ログ管理","x":"インシデント時に疑わしい動作を可視化して判断を助けるSIEMの機能はダッシュボードです。"},{"id":142,"q":"最近、ある国際銀行が取引処理システムでセキュリティ侵害を発見しました。この侵害には高度なマルウェアが関与しており、標準的なウイルス対策ソフトウェアを回避しただけでなく、侵入検知システムによって何ヶ月も検出されませんでした。このマルウェアは、取引額を断続的に変更し、少額を海外の口座に送金するようにプログラムされており、その動作が巧妙であるため検出が困難でした。徹底的な調査の後、サイバーセキュリティの専門家はこのマルウェアの性質を特定しました。\n\nこの侵害で使用されたマルウェアの種類を最もよく表しているのは次のうちどれですか。","c":["ランサムウェアは、取引データを暗号化して銀行から金銭を奪い取る","悪意のあるトランザクションを実行しながら、正当なソフトウェアを装う","スパイウェア、銀行の取引や顧客に関する機密情報を収集する Rootki'","トランザクションプロセスを操作するため、システムに深く埋め込まれる"],"a":[3],"h":"","p":false,"cat":"攻撃・脅威・ソーシャル","g":"脅威とマルウェア","x":"システムの奥深くに埋め込まれ、トランザクション処理を操作して検出が困難なマルウェアはルートキットの性質です。"},{"id":143,"q":"セキュリティ専門家のエリオットは、組織の企業ネットワークにファイアウォールを実装および展開する任務を負っていました。ネットワークにファイアウォールを計画および展開した後、エリオットはファイアウォールのログを監視して、進化する脅威と攻撃を検出しました。これにより、ファイアウォールのセキュリティを確保し、ネットワークの問題に事前に対処できるようになりました。\n\nファイアウォールの実装と展開の次のどのフェーズで、エリオットはファイアウォールログを監視しましたか?","c":["デプロイ中","管理と維持","テスト","設定"],"a":[1],"h":"","p":false,"cat":"ネットワーク・FW","g":"FW運用・構成","x":"FW導入のフェーズは設定→テスト→デプロイ→管理と維持。ログを継続的に監視して問題に先手を打つのは『管理と維持』です。"},{"id":144,"q":"法医学者のデズモンドは、さまざまなオンライン攻撃に関与した侵害されたマシンを調査していました。この目的のために、デズモンドは、コンピュータベースの証拠を抽出して分析する法医学ツールを使用し、被害者のマシンからアクセスされた Webサイトに関連する情報を取得しました。\n\nこのシナリオでデズモンドが取得したコンピュータで作成された証拠を特定します。","c":["クッキー","ドキュメント","アドレス帳","圧縮ファイル"],"a":[0],"h":"","p":false,"cat":"フォレンジック","g":"捜査チーム・報告書","x":"被害者のマシンからアクセスされたWebサイトに関連する、コンピュータが作成した証拠はクッキーです。"},{"id":145,"q":"IPアドレス20.20.10.26にあるWebサーバーの脆弱性評価を担当します。重大度スコアが&Aの脆弱性を特定してください。この課題では、ParrotSecurityマシンに付属のOpenVAS脆弱性スキャナー（認証情報：admin/password）を使用できます。","c":["TCPライムスタンプ","FTP 暗号化されていないクリアテキスト ログイン","匿名FTPログインレポート","UDP ライムスタンプ"],"a":[2],"h":"lab6-4\n問題集では「TCPライムスタンプ」が回答となっていた\n●回答方法\nAttacker Machineで\nデスクトップウィンドウ上部の「Applications」→「Pentesting」\n→「Vulnerability Analysis」→「Openvas - Greenbone」→「Start」でGreenboneを起動。\n→ログイン情報入力し、初期化を待つ。　sudo openvas-start\nFirefoxブラウザを起動し、https://127.0.0.1:9392と入力してGreenboneを起動。\n上部の「scans」タブ→「tasks」。左上の「魔法の杖」アイコンから「Task Wizard」を\n開き、対象のIPアドレスを入力し、「Start Scan」を押す。\n※スキャンには20分くらいかかる。。。\nスキャン後は、対象のステータスの「Done」をクリックし、「Results」タブを開く。\n→深刻度レベルは「中（Medium）」が正解かな？","p":true,"cat":"実技ラボ","g":"OpenVAS脆弱性スキャン","x":"同じGreenboneラボ。CSV正解は『匿名FTPログインレポート』(問題集は『TCPタイムスタンプ』と記載)。"},{"id":146,"q":"ある組織の暗号化スペシャリストである Omar は、RFIDタグ、センサーベースのアプリケーション、その他の IbTベースのアプリケーションなど、複雑性の低いアプリケーションを保護する任務を負っていました。この目的のために、彼は、デバイスのセキュリティを損なうことなく、消費電力とリソースの消費を抑えるすべての低電力デバイス用のアルゴリズムを採用しました。\n\nこのシナリオで Omar が採用したアルゴリズムを特定します。","c":["量子暗号","楕円曲線暗号","軽量暗号化","準同型暗号化"],"a":[2],"h":"","p":false,"cat":"暗号・署名","g":"暗号方式の使い分け","x":"低電力デバイス向けに消費電力やリソースを抑えつつ安全性を保つアルゴリズムは軽量暗号(ライトウェイト暗号)。ECCも小さい鍵が特長ですが、『低電力デバイス専用』と言えば軽量暗号です。"},{"id":147,"q":"サイバーセキュリティ コンサルタントの ApexTech は、大手エネルギーコングロマリットから、エネルギーグリッド制御システムの堅牢性を評価するよう依頼を受けました。このコングロマリットは、従来のシステムから相互接続性の高いスマート グリッドに移行しています。ApexTechは、新しい設定の潜在的な脆弱性を特定するための侵入テストを提案しました。同社は、システムの脆弱性を包括的に評価するために使用できる 4つの方法論を提供しました。\n\nエネルギーコングロマリットは、移行中のインフラストラクチャのコンテキストで脆弱性を特定するのに最も効果的で有益なアプローチを選択する必要があります。","c":["エネルギー会社の IT チームとテスターの両方が、これから行われるテストについて知らない二重盲検テスト。","テスト担当者がインフラストラクチャに関する事前の知識を持たないブラインド侵入テスト 。","コングロマリットの外部に公開されている資産とシステムのみに焦点を当てた外部テスト。","テスターと IT チームの両方が協力して十分な情報を得た上で行われるターゲットテスト。"],"a":[3],"h":"","p":false,"cat":"攻撃・脅威・ソーシャル","g":"テスト種別・チーム","x":"移行中のインフラの脆弱性を最も効果的に特定するのは、テスターとITチームが協力して十分な情報のもと行うターゲットテストです(CSVの正解)。"},{"id":148,"q":"大手金融機関である SecuraCorp は、ゼロデイ脆弱性を懸念しています。ネットワークインフラストラクチャが広範に広がり、トランザクションポイントが複数あるため、シグネチャだけに頼るのではなく、ネットワークの動作に基づいて疑わしいパターンを効果的に識別できるシステムが必要です。\n\nSecuraCorpは、自社のニーズに合わせて、主にどのタイプの IDS/IPS を導入すべきでしょうか。","c":["ネットワークベースのIDS","異常ベースのIDS","シグネチャベースのIDS","ホストベースのIDS"],"a":[1],"h":"","p":false,"cat":"検知(IDS)・ログ・SIEM","g":"検知方式","x":"シグネチャに頼らず、ネットワークの動作(振る舞い)から疑わしいパターンを見つけるのは異常ベースのIDS/IPSです。"},{"id":149,"q":"あるソフトウェア会社は、安全なアプリケーション開発のベストプラクティスに従って、新しいソフトウェア製品を開発しています。ソフトウェアアナリストの Dawsonは、クライアントのネットワーク上のアプリケーションのパフォーマンスをチェックして、エンドユーザーがアプリケーションにアクセスする際に問題が発生していないかどうかを判断しています。\n\n安全なアプリケーション開発ライフサイクルの次のどの層でアプリケーションのパフォーマンスのチェックが必要ですか?","c":["開発","テスト","品質保証 (QA)","ステージング"],"a":[1],"h":"","p":false,"cat":"アプリ・クラウド・仮想化","g":"SDLC","x":"Q10と重複。パフォーマンス確認は『テスト』層です。"},{"id":150,"q":"業界をリードするサイバーセキュリティ コンサルティング会社である Cyber​​Guard Corpでは、あなたは、注目度の高いサイバー侵害への対処における専門知識で知られる主任インシデント対応担当者です。あなたのチームは主に、世界的な企業、外交機関、国家の機密性が高い機関にサービスを提供します。ある日、あなたは暗号化された匿名の電子メールを受け取ります。その電子メールは、有名な国際銀行コンソーシアムであり、あなたの主要顧客の 1 つである WorldBank Inc.で侵害の可能性があることを示唆しています。電子メールにはハッシュ化されたファイルが含まれており、富裕層の金融取引を漠然と示唆しています。最初の評価では、抽出されたデータの性質と精度から、これは高度な持続的脅威 (APT)である可能性があり、おそらく国家が支援する攻撃者であると考えられます。予備的な兆候はゼロデイ攻撃の可能性を示唆していますが、チームはフォレンジック調査を徹底的に行って、侵害の原因を突き止め、その規模を評価し、迅速に対応する必要があります。\n\nこの攻撃の高度に洗練された性質と潜在的な地政学的影響を考慮すると、このサイバー侵入を綿密に分析するために優先すべき高度な手法は何でしょうか。","c":["高度なサンドボックス技術を活用して、ハッシュ化されたファイル内の潜在的なゼロデイ攻撃の動作を安全に検査し、異常なシステム相互作用やネットワーク通信を評価します。","脅威ハンティングツールと組み合わせたヒューリスティックベースの分析を適用して、異常なパターンを追跡します。世界銀行の広大なデジタルインフラ全体にわたる行動や不一致。","世界的なサイバーセキュリティの同盟やパートナーシップと協議して、同様の攻撃パターンに関する情報を収集し、侵害の原因が既知のAPT グループにあるかどうかを確認します。","重要なサーバーとネットワーク デバイスから詳細なログ分析を実行し、タイムラインベースのアプローチに重点を置いて、侵害につながるイベントを再構築します。"],"a":[0],"h":"","p":false,"cat":"攻撃・脅威・ソーシャル","g":"脅威とマルウェア","x":"ハッシュ化されたファイル内のゼロデイの挙動を安全に観察できる高度なサンドボックス技術が、洗練された侵入の分析に最も適しています(CSVの正解)。"},{"id":151,"q":"不満を抱いた従業員が、今後のプロジェクトの機密性の高い入札データを暗号化されたテキストとして転送しました。あなたには、AttackerMachinedのダウンロードフォルダにあるテキストファイルsnitch.txtをデコードし、greenfarmプロジェクトの価値をドルで判定する任務が与えられています。\n\nヒント1:すべての暗号化ツールは次の場所にあります。「Z:\\CCT-Tools\\CCT Module 14 Cryptography」。\nヒント 2: 必要に応じて、sniffer@123をパスワードとして使用してファイルをデコードできます。(実践的な質問)","c":["9S000","36000","80000","75000"],"a":[3],"h":"lab12-4\n●回答方法\n「Z:\\CCT-Tools\\CCT Module 14 Cryptography」内の「BCTextEncoder」を起動。\nダウンロードフォルダ（Downloads）にある snitch.txt をツールに読み込ませる。\n※テキスト内容をコピー＆ペーストでもOK。\nパスワード入力ダイアログが表示されたら、ヒントにあるパスワードを入力する。\nDecodeを実施。　greenfarmプロジェクトの金額を選択。","p":true,"cat":"実技ラボ","g":"暗号・ハッシュ・ステガノ","x":"BCTextEncoderでsnitch.txtをパスワードでデコードし、greenfarmプロジェクトの金額を確認します。"},{"id":152,"q":"ある組織のネットワーク スペシャリストである Tenda は、Windows イベントビューアーを使用してログに記録されたデータを調べ、不正なアクティビティの試行または成功を特定していました。Tenda が分析したログには、Windowsセキュリティに関連するイベント(具体的には、ログオン/ログオフアクティビティ、リソース アクセス、および Windowsシステムの監査ポリシーに基づく情報) が含まれています。\n\n上記のシナリオで Tenda によって分析されたイベント ログの種類を特定します。","c":["アプリケーションイベントログ","セットアップイベントログ","セキュリティイベントログ","システムイベントログ"],"a":[2],"h":"","p":false,"cat":"フォレンジック","g":"Windowsイベントログ","x":"ログオン/ログオフ、リソースアクセス、監査ポリシーに基づく情報を含むのはセキュリティイベントログです。"},{"id":153,"q":"組織のリスク管理チームは、組織の現在の所在地で自然災害が発生するリスクを特定しました。セキュリティ管理では自然災害を防ぐことはできないため、チームは特定されたリスクを排除するために別の場所に新しいオフィスを建設することを提案しました。\n\nこのシナリオでリスク管理チームが提案したリスク処理オプションを特定します。","c":["リスク修正","リスク回避","リスク共有","リスク保持"],"a":[1],"h":"","p":false,"cat":"規格・法規・リスク管理","g":"リスク管理","x":"自然災害のリスクを排除するため別の場所に新オフィスを建設=リスク回避です。"},{"id":154,"q":"ある多国籍企業の IT 部門は、グローバル データ センター向けに新しいネットワークセキュリティプロトコルを実装しました。このプロトコルは、高度なアクセス制御の原則を組み込むことでセキュリティ対策を強化するように設計されています。このプロトコルでは、複数の方法を組み合わせて、許可された担当者だけが機密データにアクセスできるようにします。最近、許可されていないユーザーが機密データにアクセスするという事件が発生しました。セキュリティチームは、侵入者がアクセス制御システムの特定の側面を悪用したことを発見しました。\n\nアクセス制御の原則、用語、およびモデルのどの側面が最も悪用された可能性がありますか?","c":["属性ベースのアクセス制御(ABAC)。アクセスの決定は、一連のポリシーと属性に基づいて行われます。","任意アクセス制御 (DAC)。リソース所有者がアクセス許可を決定します。","ロールベースのアクセス制御 (RBAC)。組織内の役割に基づいてアクセスが付与されます。","強制アクセス制御(MAC)。システム管理者が設定した定義済みルールに基づいてアクセスの決定が行われます"],"a":[1],"h":"","p":false,"cat":"データ保護・アクセス制御","g":"アクセス制御モデル","x":"リソース所有者が許可を決めるのはDAC(任意アクセス制御)。所有者の判断で権限が広がりやすく、悪用されやすいのが弱点です。"},{"id":155,"q":"あなたは、さまざまな分野のクライアント向けに人工知能 (AI)製品の開発を専門とする最先端のテクノロジー組織の主任サイバーセキュリティ専門家です。製品の機密性と独自性を考えると、最高レベルのセキュリティを確保することが最も重要です。ある日の夜遅く、脅威インテリジェンス プラットフォームから、AI製品が大きく依存しているサードパーティ コンポーネントの 1つに潜在的な脆弱性があるという警告を受け取りました。このコンポーネントは、組織内のいくつかの主要システムとの統合ポイントがあることがわかっています。この脆弱性を悪用されると、攻撃者は独自のアルゴリズムやクライアント固有の変更に比類のないアクセス権を得ることになり、悪用されれば壊滅的な結果を招く可能性があります。脅威の詳細を分析しているときに、チームのメンバーがデータアクセスの異常なパターンをいくつか特定し、脆弱性がすでに悪用されている可能性があることを示唆しました。潜在的な侵害の最初の痕跡は、非常に高度なアクター、場合によっては国家機関によるものであることを示唆しています。\n\n状況の重大性と本格的な侵害の潜在的な結果を考慮すると、インシデントに対処し、リスクの露出を最小限に抑えるために、すぐにとるべき行動は何でしょうか。","c":["国家レベルの脅威に関する専門知識を持つ外部のサイバーセキュリティコンサルタントと連携します。侵害の全容を把握するために並行して調査を実施しながら、緩和戦略を策定するために協力します。","侵害の可能性があるシステムをネットワークから切断し、すべてのログと関連データを将来の分析のためにアーカイブし、コア サービスをバックアップ システムに移行してビジネスの継続性を確保します。","組織の法務および広報チームに警告し、潜在的な侵害について顧客と一般の人々に通知するためのコミュニケーション戦略を準備し、透明性と事前の被害管理を確保します。","緊急パッチ適用プロトコルを開始し、インフラストラクチャ全体の脆弱なコンポーネントのすべてのインスタンスを直ちに更新し、ネットワークをさらに異常なアクティビティがないか注意深く監視します。"],"a":[1],"h":"","p":false,"cat":"インシデント対応","g":"初動対応","x":"国家レベルの攻撃が疑われても、まず該当システムをネットワークから切り離し、ログと証拠を保全します。"},{"id":156,"q":"大都市の市営企業は、市内のさまざまな施設を管理するために、大規模な IoTネットワークを展開していました。最近のサイバー攻撃により、市の重要なサービスが麻痺し、完全に停止しました。セキュリティ オペレーション センター (SOC)は、攻撃中にネットワーク トラフィックをキャプチャし、攻撃者マシン 1 のドキュメントフォルダーに loT_capture.pcapng として保存しました。\n\nキャプチャファイルを分析し、ネットワーク経由でIoTデバイスに送信されたコマンドを特定します。(実践的な質問)","c":["Woodland_Blaze_ 警告ギル","ウッドランドブレイズ警告999","ネイチャーブレイズ警告555","森林火災警報444"],"a":[3],"h":"lab11-1\n●回答方法\nframe contains \"Alert\"\n絞り込まれたパケットで右クリック「Follow->TCPストリーム」で\n送信されたコマンド文字列を確認。が最速か？？？","p":true,"cat":"実技ラボ","g":"Wireshark解析","x":"Wiresharkでframe contains \"Alert\"で絞り、Follow TCP Streamでコマンド文字列を確認します。"},{"id":157,"q":"大手テクノロジー企業である TechTYendz は、金融取引のリアルタイムデータ処理を目的とした新しいクラウドベースの Webアプリケーションの開発の最終段階に進んでいます。データの重要性と予想される大量のユーザーを考慮して、TechTYendz のセキュリティ チームは、厳格なアプリケーションセキュリティテスト手法の採用に熱心です。チームは、アプリケーションに対する実際の攻撃を最もよく模倣できるツールを使用して、一連のテストを実行することにしました。チームの主な関心事は、構成エラー、ソフトウェア バグ、および欠陥のある APIに起因する脆弱性を含む、システムの脆弱性を検出することです。セキュリティの専門家は、4 つのテストツールと手法を最終候補に挙げました。\n\nアプリケーションのセキュリティを徹底的に評価するための最も包括的な方法は、次のうちどれでしょうか。","c":["実行中のアプリケーションをリアルタイムで分析する動的アプリケーションセキュリティ テスト (DAST) ツールを採用します。","静的アプリケーション セキュリティ テスト (SAST) ツールを使用して、ソースコードの脆弱性をスキャンします。","より包括的なセキュリティ概要を実現するために、SAST 機能と DAST機能の両方を組み合わせたツールを実装します。","ユーザー インターフェイスとトランザクションモジュールのみに焦点を当てた手動侵入テストを実行します。"],"a":[2],"h":"","p":false,"cat":"アプリ・クラウド・仮想化","g":"安全なアプリ","x":"SASTとDASTを組み合わせるのが最も包括的なアプリケーションセキュリティ評価です。"},{"id":158,"q":"コンピュータ サイエンスを専攻する学生の Nicolasは、さまざまなラボ操作のためにラップトップにゲスト OSを作成することにしました。彼は、ゲスト OSが仮想化環境で実行されていることを認識しない仮想化アプローチを採用しました。仮想マシン マネージャー (VMM)は、コンピューターのハードウェアと直接対話し、コマンドをバイナリ命令に変換して、ホスト OS に転送します。\n\n上記のシナリオで、Nicolas は次の仮想化アプローチのどれを採用しましたか?","c":["ハードウェア支援による仮想化","完全仮想化","ハイブリッド仮想化","OS 支援による仮想化"],"a":[1],"h":"","p":false,"cat":"アプリ・クラウド・仮想化","g":"仮想化","x":"VMMがハードウェアと直接やり取りし、命令を変換してホストOSへ渡す方式は完全仮想化(CSVの正解)です。"},{"id":159,"q":"インシデント対応者の Cairoは、組織のネットワークで発生したインシデントに対応していました。すべての IH&R手順を実行した後、Cairoはインシデント後の活動を開始しました。彼は、影響を受けたすべてのデバイス、ネットワーク、アプリケーション、およびソフトウェアを特定して評価することにより、インシデントによって発生したすべての種類の損失を判定しました。\n\nこのシナリオで Cairoが実行したインシデント後の活動を特定します。","c":["インシデントの影響評価","調査を終了する","ポリシーの確認と改訂","インシデントの開示"],"a":[0],"h":"","p":false,"cat":"インシデント対応","g":"IH&Rの段階","x":"インシデントで発生したすべての損失を判定する=インシデントの影響評価(事後活動)です。"},{"id":160,"q":"セキュリティ専門家のブリエルは、組織のネットワークを悪意のある活動から保護するように指示されました。これを実現するために、彼女はさまざまなソースからイベントデータを収集する制御システムでネットワークアクティビティの監視を開始しました。このプロセス中に、ブリエルは悪意のある人物が組織のネットワークに接続されたネットワークデバイスにアクセスするためにログインしたことを確認しました。\n\nブリエルが上記のシナリオで特定したイベントは次のうちどれですか。","c":["失敗監査","エラー","成功監査","警告"],"a":[2],"h":"","p":false,"cat":"フォレンジック","g":"Windowsイベントログ","x":"悪意のある人物が正常にログインした=『成功監査』イベントです。"},{"id":161,"q":"あなたは、衛星通信システムを専門とする多国籍企業の最高サイバーセキュリティ責任者です。最近、世界中の複数の地上局を含む、より高度なシステムアーキテクチャに移行しました。これらの局は、ネットワーク全体で暗号化されたデータの配信を管理する中央ハブを介して同期および通信します。四半期ごとのネットワークログを確認すると、一連の高度な侵入が見つかりました。これらの侵入は、3つの大陸にある地下局で断続的に発生しています。証拠から、これらの攻撃は組織化されており、ネットワークの通信経路をマッピングすることを目的としており、おそらくはるかに大規模なサイバー攻撃に備えるためのものであることがわかります。さらに調査を進めると、システム内にマルウェアの小さなポケットが見つかりました。これは、現在のセキュリティ制御を回避するように特別に設計されています。\n\n中断のない衛星通信を確保することの重要性を考えると、これらの侵入を阻止し、データの整合性を確保し、衛星通信システムの運用状態を維持するために最も効果的な対策はどれでしょうか。","c":["高度なマルウェア検出、根絶、防止に重点を置き、各地上局のエンドポイントセキュリティ ソリューションを強化します。","各地上局にエアギャップシステムを実装して完全な分離を確保し、マルウェアの拡散や外部からの侵入のリスクを最小限に抑えます。","高度なネットワークセグメンテーション戦略を導入し、リアルタイムの脅威監視と動的なポリシー調整により、各地上局がマイクロセグメント化された環境で動作することを保証します。","特定された侵入について徹底的な調査を開始し、必要な法的措置を講じながら、システムを以前のアーキテクチャにロールバックします。"],"a":[2],"h":"","p":false,"cat":"ネットワーク・FW","g":"ネットワーク防御","x":"衛星通信のような重要システムには、高度なネットワークセグメンテーションとリアルタイム脅威監視、動的ポリシー調整が最も効果的です。"},{"id":162,"q":"大手 IT コンサルタント会社である TechSolutions は、市の公共図書館のワイヤレスネットワークインフラストラクチャの全面改修を請け負っています。毎日何千人ものユーザーがネットワークにアクセスするため、潜在的な脅威を阻止できる強力な暗号化が不可欠です。また、TechSolutionsは、図書館利用者が使用するさまざまなデバイスを考慮し、下位互換性を確保する必要があります。\n\nこのシナリオに最適な暗号化メカニズムはどれでしょうか。","c":["WPA3 (Wi-Fi 保護アクセス 3)","WEP (有線同等プライバシー)","TKIP (一時鍵整合性プロトコル)","AES-CCMP (カウンターモード暗号ブロック連鎖メッセージ認証コードプロトコルを備えた高度暗号化 標準)"],"a":[0],"h":"","p":false,"cat":"無線・モバイル・IoT","g":"無線暗号・認証","x":"強力な暗号化が必要で下位互換も考慮…のCSVの正解はWPA3です。WEP/TKIPは弱く、AES-CCMPはWPA2です。"},{"id":163,"q":"ある組織は、IT インフラストラクチャを外部からの攻撃から保護するために、ネットワークオペレーション センター (NOC)チームを採用しました。組織は、ある種の脅威インテリジェンスを利用して、進化する脅威からリソースを保護しました。脅威インテリジェンスは、NOCチームが攻撃者が組織に対して攻撃を実行すると予想される方法を理解し、情報漏洩を特定し、攻撃の目的と攻撃ベクトルを判断するのに役立ちました。\n\n上記のシナリオで組織が使用する脅威インテリジェンスの種類を特定します。","c":["運用上の脅威インテリジェンス","戦略的脅威インテリジェンス","技術的な脅威情報","戦術的脅威情報"],"a":[3],"h":"","p":false,"cat":"攻撃・脅威・ソーシャル","g":"脅威ハンティング・インテリジェンス","x":"攻撃者の手口(TTP)や攻撃ベクトルを把握するのは戦術的脅威インテリジェンスです。"},{"id":164,"q":"ある組織では、すべてのサーバーとデータベース システムが、入口が 1つしかない密閉された部屋で保護されています。入口は物理的なロックシステムで保護されており、回転するダイヤルと他のいくつかの回転ディスクを組み合わせて、一連の数字と文字を入力する必要があります。\n\n上記のシナリオにおいて、組織が使用する物理ロックの種類は次のどれですか?","c":["デジタルロック","コンビネーションロック","機械式ロック","電磁ロック"],"a":[1],"h":"","p":false,"cat":"物理セキュリティ","g":"ロックの種類","x":"回転するダイヤルと回転ディスクで数字・文字を入力する=コンビネーションロックです。"},{"id":165,"q":"大規模な金融機関が高度なサイバー攻撃の標的となり、大量のデータ漏洩と金銭的損失が発生しました。この攻撃は実行方法が独特で、従来のセキュリティ対策を回避する複数の段階と手法が使用されていました。金融機関のサイバーセキュリティチームは、事後分析で、攻撃者がよく知られたハッキン​​グフレームワークに沿った複雑な手法を採用していることを発見しました。攻撃者が使用したフレームワークを特定することは、金融機関が防御戦略を見直す上で非常に重要です。\n\n次のハッキングフレームワーク/手法のうち、観察された攻撃パターンに最もよく該当するものはどれですか。","c":["MITRE ATT&CK。実際の攻撃で使用される幅広い戦術と手法を網羅しています。","OWASP Top Ten。Webアプリケーションのセキュリティリスクに焦点を当てています。","ISO/IEC 27001。情報セキュリティ管理システムに焦点を当てている","NIST サイバーセキュリティ フレームワーク。主にサイバーセキュリティ リスクの管理に使用されます"],"a":[0],"h":"","p":false,"cat":"攻撃・脅威・ソーシャル","g":"キルチェーン・フレームワーク","x":"実際の攻撃で使われる戦術・技術を網羅するのはMITRE ATT&CKです。"},{"id":166,"q":"攻撃者は専用ツールを使い、異なるMACアドレスから偽のDHCPDISCOVERメッセージを大量送信する。新しくIPアドレスを取得できなくなる。","c":["DHCP枯渇攻撃(DHCP Starvation Attack)","追加問題"],"a":[0],"h":"","p":false,"cat":"攻撃・脅威・ソーシャル","g":"追加問題","x":"異なるMACアドレスから偽のDHCPDISCOVERを大量送信し、IPプールを使い切らせるのはDHCP枯渇攻撃(DHCP Starvation)です。"},{"id":167,"q":"雇ったセキュリティエンジニアが攻撃テストする。何ハッカー？","c":["ホワイトハッカー","追加問題"],"a":[0],"h":"","p":false,"cat":"攻撃・脅威・ソーシャル","g":"追加問題","x":"雇われて許可のもと攻撃テストをするのはホワイトハッカー(倫理的ハッカー)です。"},{"id":168,"q":"通信を盗聴して認証情報を入手したからその情報を元に何回も認証した","c":["セッションリプレイ","追加問題"],"a":[0],"h":"","p":false,"cat":"攻撃・脅威・ソーシャル","g":"追加問題","x":"盗聴した認証情報を使って何度も認証する攻撃はセッションリプレイ(リプレイ攻撃)です。"},{"id":169,"q":"被害者へペイロードしたけど、セキュリティ製品の目をごまかしたい。その手法は？","c":["クリプト","追加問題"],"a":[0],"h":"","p":false,"cat":"攻撃・脅威・ソーシャル","g":"追加問題","x":"ペイロードを送る際、セキュリティ製品の検知を避けるため暗号化・難読化するのはクリプタ(crypter)の手法です。"}], GN={"鍵と署名":"署名は『秘密鍵で署名 → 公開鍵で検証』。暗号化は逆で『公開鍵で暗号化 → 秘密鍵で復号』。","暗号方式の使い分け":"キーワードで即答: 光子=量子暗号 / 低電力=軽量暗号 / 暗号化したまま計算=準同型 / 暗号化と復号=RSA(HMACは認証のみ) / 量子耐性ハッシュ=SHA-3。","データ保護手法":"マスキング=*や#で置換 / トークン化=別の値に置換 / ハッシュ=不可逆変換 / DLP=持ち出し・漏洩を検知して防ぐ。","データの3状態":"保存データ=ディスク上 / 転送中=通信経路上 / 使用中=メモリ上で処理中。","CIA+否認防止":"機密性=見せない / 完全性=改ざんさせない / 可用性=使いたい時に使える / 否認防止=やっていないと言わせない(署名)。","アカウント種別":"グループ=グループ単位で権限付与 / ゲスト=必要最小限だけ / 共有=複数人で1アカウント / サービス=アプリ用。","アクセス制御モデル":"DAC=所有者が決める / MAC=管理者・システムが固定ルールで決める / RBAC=役割(ロール)で決める / ABAC=属性とポリシーで決める。","認証":"多要素認証(MFA)=知識・所持・生体のうち複数を組み合わせる。","ファイアウォールの種類":"パケットフィルタ=L3/L4でヘッダだけ / サーキットレベルGW=L5セッション層でTCPハンドシェイク監視 / ステートフル=セッション状態を保持 / アプリケーションGW(プロキシ)=L7で中身を検査。","FW運用・構成":"バスチオンホスト=外部に晒す要塞ホスト。犠牲マシンは侵害されても良い前提のホスト。FWの運用段階の『管理と維持』でログ監視。","ICMP・TTL・コマンド":"ICMP: Type3=宛先到達不能 / Type11=時間超過 / Type12=パラメータ問題 / Type8=エコー要求。TTL初期値: Linux=64 / Windows=128 / ネットワーク機器=255。経路上のパケット損失確認=traceroute。","プロトコル・通信":"RADIUS=クライアントサーバ型のリモート認証(AAA)。SSH(22)やVNC(5900)は正規のリモート管理にも使われる。","VPN・クラウド接続":"ハブ&スポーク=拠点同士は本社経由 / フルメッシュ=全拠点が相互接続 / スター=中心1点。トランジットゲートウェイ=複数VPC・ネットワークを集線。","ネットワーク機器":"リピーター=信号を増幅して延長 / ブリッジ=ネットワーク同士を接続。","Wiresharkメニュー":"統計=概要・IOグラフ・フローグラフ / 分析=プロトコル解析の有効化/無効化・ユーザー指定デコード / キャプチャ=取得開始設定。","シグネチャ分析":"アトミック=単一パケットで判定 / コンテキストベース=ヘッダ等の項目や前後関係を見る / コンテンツベース=ペイロード内容 / 複合=複数パケットにまたがる。","アラート種別":"攻撃あり×警告あり=TP / 攻撃なし×警告なし=TN / 攻撃あり×警告なし=FN(見逃し) / 攻撃なし×警告あり=FP(誤検知)。","検知方式":"シグネチャ=既知パターン照合 / 異常検知=正常のモデル(ベースライン)から外れたものを検出 → 未知の攻撃に強いが誤検知あり。","IDSとIPS":"IDS=検知して通知 / IPS=検知してインラインで自動ブロック。","IDS回避":"難読化=Unicode等でエンコードしてIDSをすり抜ける / セッションスプライシング=パケットを分割 / 非同期化=シーケンス番号をずらす。","SIEM・ログ管理":"ログは集中管理+相関分析が基本。SIEMのダッシュボード=状況の可視化と判断。Windows/Linuxの混在ではログ形式の非互換が課題。","ハニーポット":"低インタラクション=擬似サービスで基本情報だけ(事前設定コマンドにのみ応答) / 高インタラクション=本物同様で詳細に観察(リスク大) / 純粋=実システムそのもの。","近距離無線":"RFID=電波でタグを自動識別(バッジ・商品スキャン) / NFC=数cmで通信、RFIDも読めBluetooth接続の起点にもなる / 赤外線(IR)=見通し必須の短距離。","無線暗号・認証":"WEP=RC4 / WPA=TKIP / WPA2=AES-CCMP / WPA3=SAE+最新(楕円曲線)。企業向け認証の定番=EAP-TLS(証明書)。","無線攻撃":"イビルツイン=正規APになりすました偽AP / KRACK=WPA2の鍵再インストール / ブルースナーフィング=Bluetooth経由で情報窃取。","モバイル管理":"UEM=端末・アプリ・BYOD等を統合管理 / コンテナ化=業務と私用領域を分離 / ジオフェンシング=仮想境界で位置判定 / VPN=未知ネットワークでも暗号化通信。","IoT・OT":"IoTは初期設定の変更・ファームウェア更新・分離ネットワークが基本。ICS/OT境界(IDMZ)にはDoS対策など。","IH&Rの段階":"準備→検出と分析→封じ込め→根絶→回復→事後活動。封じ込め=拡散防止 / 根絶=原因除去・パッチ / 回復=復元・復旧確認(バックアップの無マルウェア確認も)。事後=影響評価・教訓。","初動対応":"インシデント発生時の最優先は『影響範囲の隔離(封じ込め)+証拠保全』。広報・通知・恒久対策・身代金支払いは後。","BC/DR活動":"予防=発生と影響を減らす / 応答 / 再開 / 復旧=被害前の水準へ戻す。","BCPとDRP":"BCP=事業全体を継続する計画 / DRP=ITの技術的復旧が中心。","バックアップ手法":"コールド=停止して取得 / ウォーム=一部稼働 / ホット=稼働中に取得。","RAID":"RAID0=分散のみ(容量=合計、冗長なし) / RAID1=ミラー(容量半分) / RAID5=パリティ付き分散。","障害時の判断":"BCP/クラウドを使った一時的な負荷分散・容量確保で継続性を守る。","データ取得":"ビットストリームイメージング=全体のクローン(削除領域も取得) / 論理的獲得=ファイル単位。揮発順序: レジスタ→キャッシュ→メモリ→ディスク→アーカイブメディア(最後)。","証拠の扱い":"証拠規則: 本物=出所・関連性 / 許容される=法廷に出せる / 信頼できる / 理解できる。モバイルは電源・画面・充電を意識、現場は最初に確保。","捜査チーム・報告書":"弁護士=法的助言 / 専門家証人=証言 / 報告書の『調査目的』=申し立て内容と警察への情報。","Linuxログ":"wtmp=ログイン履歴 / boot.log=起動 / secure=認証 / kern.log=カーネル / httpd=Web。","Windowsイベントログ":"セキュリティ=ログオン・リソースアクセス・監査 / システム / アプリケーション / セットアップ。成功監査=成功した操作の記録。","ロックの種類":"機械式=鍵 / コンビネーション=ダイヤル(数字・文字) / デジタル=カードやコード / 電磁=電磁石。","物理セキュリティ対策":"物理的制御=警備員・生体認証・錠・防壁・消火設備。対策は立地リスク(洪水等)と課題に合わせて選ぶ。","ソーシャルエンジニアリング":"対価(quid pro quo)=見返りと引き換え / スピアフィッシング=特定標的 / ビッシング=電話 / 盗聴=通信の傍受。","脅威とマルウェア":"国家支援=高度で機密情報狙い / APTの侵入=ゼロデイが典型 / ルートキット=深く潜伏。","AI・サプライチェーン":"学習データ汚染対策=検証済みデータで再学習。","追加問題":"ユーザー追加の問題。DHCP枯渇=偽DISCOVER大量送信 / ホワイトハッカー=許可を得て試験する人 / リプレイ=盗聴した認証情報を再送 / クリプタ=難読化・暗号化で検知回避。","脅威ハンティング・インテリジェンス":"データ駆動=既存データから仮説 / TTP駆動 / エンティティ駆動。戦術的=攻撃者の手口(TTP)、戦略的=経営層向け、運用的=攻撃の背景・時期、技術的=IoC。","キルチェーン・フレームワーク":"キルチェーン: 偵察→武器化→配送→攻撃→インストール→C&C→目的実行。ATT&CK=実際の攻撃の戦術・技術。","テスト種別・チーム":"赤=攻撃 / 青=防御 / 紫=赤+青の協調 / 白=管理。ブラックボックス=情報なし(ゼロ知識)。","PCI DSS":"要件1.3.x=ファイアウォール/DMZ / 5.x=マルウェア対策(5.1=ウイルス対策導入、5.3=無効化・改変を防ぐ)。","規格・法規の選択":"GDPR=EU / HIPAA=米国医療 / PCI DSS=カード / SOX=財務報告 / ISO27001=ISMS / NIST CSF=柔軟でカスタマイズ可能。","ガバナンス・ポリシー":"ポリシーは関係者(ステークホルダー)の関与で策定。セキュリティはガバナンスに統合。","インターネットアクセスポリシー":"パラノイア=全面禁止・厳格 / 慎重=既知の危険を制限 / 許容=広く許可 / 無差別(プロミスキャス)=無制限。","リスク管理":"特定→評価・優先順位→対応(回避/低減/移転/受容)→監視。リスク回避=原因の活動そのものをやめる/場所を変える。","SDLC":"テスト層=パフォーマンス確認。同内容の重複問題。","安全なアプリ":"SAST+DASTの併用が最も網羅的。入力検証=SQLi対策。例外処理=エラーでの情報漏えい防止。","クラウド":"プライベート=自社専用 / パブリック / コミュニティ / マルチ。クラウド監査人=サービスを独立評価。","仮想化":"仮想マシンは分離され、1台の侵害が他へ波及しにくい。完全仮想化=VMMがハードと直接やり取りしゲストOSを無改変で動かす。","Wireshark解析":"表示フィルタ(icmp, tcp.port==1883, tcp.flags.syn==1 && tcp.flags.ack==0, frame contains \"…\")+『Follow TCP Stream』。","SQLi・プロファイルID":"URLのid=を1,2,3…と変えて対象ユーザーを探す。またはsqlmapで--dbs/--tables/--dump。","SSHでflag取得":"nmap -p 22 でSSH稼働ホストを探す → ssh → find / -name flag.txt → cat。","OpenVAS脆弱性スキャン":"Greenbone(OpenVAS)でTask Wizard→スキャン→Resultsで重大度を確認。","RATクライアント":"Theefクライアントで20.20.10.26へ接続しFile Managerから確認。","暗号・ハッシュ・ステガノ":"VeraCrypt/OpenStego/BCTextEncoder/HashCalc(certutil -hashfile)で復号・抽出・ハッシュ比較。","その他ラボ":"各ツールの操作が必要な問題。","ネットワーク防御":"セグメンテーション=ネットワークを分割して侵入・マルウェアの拡散を局所化。+監視で継続的に守る。"}, CATS=["暗号・署名", "データ保護・アクセス制御", "ネットワーク・FW", "検知(IDS)・ログ・SIEM", "無線・モバイル・IoT", "インシデント対応", "BCP・DR・バックアップ", "フォレンジック", "物理セキュリティ", "攻撃・脅威・ソーシャル", "規格・法規・リスク管理", "アプリ・クラウド・仮想化", "実技ラボ"];
var DAY=864e5, IV=[0,1,3,7,14], KEY='cct-ichimon-v1', FIX=/上記|以上のすべて|いずれも|どれも|すべて正しい/;
var QM={}; Q.forEach(function(q){QM[q.id]=q;});
var DEF={cards:{},p:{fmt:'choice',sc:1,sq:1,prac:1,size:20},day:'',today:0};
var D0={b:0,n:0,s:0,c:0,w:0,lw:0,f:0};
var S=clone(DEF), mem=null, tab='home', view='main', sess=null, L={q:'',f:'all',s:'cat'}, sub=null, resetArm=0, toastT=0;

function clone(o){return JSON.parse(JSON.stringify(o));}
function $(s){return document.querySelector(s);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function ymd(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function C(id){return S.cards[id]||D0;}
function W(id){return S.cards[id]||(S.cards[id]={b:0,n:0,s:0,c:0,w:0,lw:0,f:0});}
function load(){try{var s=localStorage.getItem(KEY);if(s)return JSON.parse(s);}catch(e){}return mem;}
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function adopt(raw){
  var n=clone(DEF);
  if(raw&&typeof raw==='object'){
    if(raw.cards&&typeof raw.cards==='object')n.cards=raw.cards;
    if(raw.p&&typeof raw.p==='object')Object.keys(n.p).forEach(function(k){if(raw.p[k]!==undefined)n.p[k]=raw.p[k];});
    n.day=raw.day||'';n.today=+raw.today||0;
  }
  S=n;
}
function rollDay(){var d=ymd();if(S.day!==d){S.day=d;S.today=0;save();}}
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},2200);}
function pool(){return Q.filter(function(q){return S.p.prac||!q.p;});}
function stats(){
  var p=pool(),now=Date.now(),r={n:p.length,m:0,l:0,u:0,due:0,weak:0,fl:0};
  p.forEach(function(q){var c=C(q.id);
    if(!c.s)r.u++;else if(c.b>=3)r.m++;else r.l++;
    if(c.s&&c.n<=now)r.due++;if(c.lw)r.weak++;if(c.f)r.fl++;});
  return r;
}
function explHtml(q){
  var h='<div class="expl"><div class="lb">解説</div>'+esc(q.x)+'</div>';
  if(GN[q.g])h+='<div class="expl note"><div class="lb">'+esc(q.g)+'：見分け方</div>'+esc(GN[q.g])+'</div>';
  if(q.h)h+='<div class="hint"><div class="lb">メモ・ヒント</div>'+esc(q.h)+'</div>';
  return h;
}
function ansText(q){return q.a.map(function(k){return q.c[k];}).join(' / ');}
function trunc(s,n){s=s.replace(/\s+/g,' ');return s.length>n?s.slice(0,n)+'…':s;}

/* ---- queue ---- */
function build(mode,arg){
  var p=pool(),now=Date.now(),size=+S.p.size,ids;
  if(mode==='cat'||mode==='grp'){
    ids=p.filter(function(q){return (mode==='cat'?q.cat:q.g)===arg;}).map(function(q){return q.id;});
    return S.p.sq?shuf(ids):ids;
  }
  if(mode==='range'){
    ids=p.filter(function(q){return q.id>=arg[0]&&q.id<=arg[1];}).map(function(q){return q.id;});
    return S.p.sq?shuf(ids):ids;
  }
  if(mode==='today'){
    var due=p.filter(function(q){var c=C(q.id);return c.s&&c.n<=now;}).sort(function(a,b){return C(a.id).b-C(b.id).b||C(a.id).n-C(b.id).n;}).map(function(q){return q.id;});
    if(size)due=due.slice(0,size);
    var need=size?Math.max(0,size-due.length):0;
    var nw=p.filter(function(q){return !C(q.id).s;}).map(function(q){return q.id;});
    nw=size?nw.slice(0,need):[];
    if(!size&&!due.length)nw=p.filter(function(q){return !C(q.id).s;}).map(function(q){return q.id;});
    ids=due.concat(nw);
    return S.p.sq?shuf(ids):ids;
  }
  var f={weak:function(c){return c.lw;},fresh:function(c){return !c.s;},flag:function(c){return c.f;},all:function(){return true;}}[mode];
  ids=p.filter(function(q){return f(C(q.id));}).map(function(q){return q.id;});
  if(S.p.sq)ids=shuf(ids);
  return size?ids.slice(0,size):ids;
}
function start(mode,arg,label){
  var ids=build(mode,arg);
  if(!ids.length){toast('対象の問題がありません');return;}
  sess={q:ids.slice(),i:0,first:{},retry:{},label:label||''};
  view='quiz';setPerm();render();window.scrollTo(0,0);
}
function setPerm(){
  var q=QM[sess.q[sess.i]],idx=q.c.map(function(_,i){return i;});
  var fixed=q.c.some(function(c){return FIX.test(c);});
  sess.perm=(S.p.sc&&!fixed)?shuf(idx):idx;
  sess.sel=[];sess.done=0;sess.ok=0;sess.reveal=0;
}
function gradeQ(id,ok){
  var firstTry=sess.first[id]===undefined;
  if(firstTry){
    rollDay();
    var c=W(id);c.s=1;
    if(ok){c.c++;c.b=Math.min(4,c.b+1);c.lw=0;}else{c.w++;c.b=0;c.lw=1;}
    c.n=Date.now()+IV[c.b]*DAY;
    S.today++;sess.first[id]=ok;
    save();
  }
  if(!ok&&!sess.retry[id]){sess.q.push(id);sess.retry[id]=1;}
}
function next(){

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  if(e.detail>0&&document.activeElement&&document.activeElement!==document.body&&document.activeElement.blur)document.activeElement.blur();
  var act=el.getAttribute('data-act'),d=el.dataset;
  switch(act){
    case 'tab':tab=d.v;sub=null;resetArm=0;render();window.scrollTo(0,0);break;
    case 'cat':sub=d.c;render();window.scrollTo(0,0);break;
    case 'back':sub=null;render();window.scrollTo(0,0);break;
    case 'catall':start('cat',sub,'cat');break;
    case 'grp':start('grp',d.g,'grp');break;
    case 'ls':L.s=d.v;render();break;
    case 'fmt':S.p.fmt=d.v;save();render();break;
    case 'mode':start(d.m,null,d.m);break;
    case 'range':start('range',[+d.a,+d.b],'range');break;
    case 'pick':
      if(sess.done)break;var k=+d.k,q=QM[sess.q[sess.i]];
      if(q.a.length>1){var i=sess.sel.indexOf(k);if(i>=0)sess.sel.splice(i,1);else sess.sel.push(k);render();}
      else{sess.sel=[k];finishChoice();}
      break;
    case 'submit':if(sess.sel.length)finishChoice();break;
    case 'reveal':sess.reveal=1;render();break;
    case 'grade':gradeQ(sess.q[sess.i],d.v==='1');next();break;
    case 'next':next();break;
    case 'flag':var c=W(sess.q[sess.i]);c.f=c.f?0:1;save();el.classList.toggle('on',!!c.f);el.setAttribute('aria-pressed',String(!!c.f));toast(c.f?'しおりを付けました':'しおりを外しました');break;
    case 'end':if(Object.keys(sess.first).length){view='result';}else{view='main';}render();window.scrollTo(0,0);break;
    case 'retry':
      var ids=Object.keys(sess.first).map(Number).filter(function(i){return !sess.first[i];});
      if(!ids.length)break;
      sess={q:S.p.sq?shuf(ids):ids,i:0,first:{},retry:{},label:'retry'};view='quiz';setPerm();render();window.scrollTo(0,0);break;
    case 'home':view='main';tab='home';render();window.scrollTo(0,0);break;
    case 'lf':L.f=d.v;render();break;
    case 'lflag':var c2=W(+d.id);c2.f=c2.f?0:1;save();el.classList.toggle('on',!!c2.f);el.setAttribute('aria-pressed',String(!!c2.f));break;
    case 'tg':S.p[d.k]=S.p[d.k]?0:1;save();render();break;
    case 'size':S.p.size=+d.v;save();render();break;
    case 'copy':
      var ta=$('#bk'),txt=JSON.stringify(S);
      var fb=function(){ta.focus();ta.select();ta.setSelectionRange(0,txt.length);toast('テキストを選択しました。コピーしてください');};
      try{navigator.clipboard.writeText(txt).then(function(){toast('コピーしました');},fb);}catch(err){fb();}
      break;
    case 'restore':
      try{var raw=JSON.parse($('#rs').value);if(!raw||typeof raw.cards!=='object')throw 0;adopt(raw);save();toast('復元しました');render();}
      catch(err){toast('記録を読み取れませんでした');}
      break;
    case 'reset':
      if(!resetArm){resetArm=1;render();setTimeout(function(){if(resetArm){resetArm=0;if(view==='main'&&tab==='set')render();}},4000);}
      else{resetArm=0;adopt(null);S.day=ymd();save();toast('消去しました');render();}
      break;
  }
});

document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey||e.isComposing||e.repeat||e.defaultPrevented)return;
  var t=e.target,tn=t&&t.tagName,k=e.key;
  if(tn==='INPUT'||tn==='TEXTAREA'||tn==='SELECT'){if(k==='Escape'&&t.blur)t.blur();return;}
  if((k==='Enter'||k===' ')&&(tn==='BUTTON'||tn==='SUMMARY'))return;
  function go(sel){var b=document.querySelector(sel);if(b&&!b.disabled){e.preventDefault();b.click();return true;}return false;}
  if(view==='quiz'){
    var q=QM[sess.q[sess.i]],card=S.p.fmt==='card';
    if(k==='Escape'){go('[data-act="end"]');return;}
    if(k==='s'||k==='S'){go('[data-act="flag"]');return;}
    if(card){
      if(!sess.reveal){if(k==='Enter'||k===' '||k==='ArrowDown')go('[data-act="reveal"]');}
      else if(k==='1'||k==='ArrowLeft')go('[data-act="grade"][data-v="0"]');
      else if(k==='2'||k==='ArrowRight')go('[data-act="grade"][data-v="1"]');
    }else if(sess.done){
      if(k==='Enter'||k===' '||k==='ArrowRight')go('[data-act="next"]');
    }else{
      var n=/^[1-9]$/.test(k)?+k-1:/^[a-eA-E]$/.test(k)?k.toLowerCase().charCodeAt(0)-97:-1;
      if(n>=0){var bs=document.querySelectorAll('[data-act="pick"]');if(bs[n]){e.preventDefault();bs[n].click();}}
      else if(k==='Enter')go('[data-act="submit"]');
    }
    return;
  }
  if(view==='result'){
    if(k==='Enter'){if(!go('[data-act="retry"]'))go('[data-act="home"]');}
    else if(k==='Escape')go('[data-act="home"]');
    return;
  }
  if(tab==='home'&&sub&&k==='Escape'){go('[data-act="back"]');return;}
  if(k==='1'||k==='2'||k==='3'){go('#nav [data-v="'+['home','list','set'][+k-1]+'"]');return;}
  if(tab==='home'&&k==='Enter')go('[data-act="mode"][data-m="today"]');
  if(tab==='list'&&k==='/'){var s=$('#lq');if(s){e.preventDefault();s.focus();}}
});

adopt(load());rollDay();render();
})();
</script>
