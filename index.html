<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>CCT 一問一答</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 1-column phone app. Home (progress + modes) / quiz (sticky top bar, sticky bottom dock) / list / settings. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#121C26; --muted:#5B6877; --line:#D5DBE3;
  --accent:#0A6C8C; --accent-ink:#FFFFFF; --mid:#8DB3C4;
  --ok:#1B7F4B; --okbg:#E1F3E8; --ng:#B3261E; --ngbg:#FBE6E3;
  --f-disp:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141B; --surface:#17202A; --ink:#E6ECF2; --muted:#93A1B1; --line:#27333F;
    --accent:#5BC0DE; --accent-ink:#06222B; --mid:#3A6578;
    --ok:#5FD18F; --okbg:#12301F; --ng:#FF8A80; --ngbg:#3A1816; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#17202A; --ink:#E6ECF2; --muted:#93A1B1; --line:#27333F;
  --accent:#5BC0DE; --accent-ink:#06222B; --mid:#3A6578;
  --ok:#5FD18F; --okbg:#12301F; --ng:#FF8A80; --ngbg:#3A1816; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px 104px; overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-align:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* home */
.top{padding:14px 0 6px}
h1{font-family:var(--f-disp);font-weight:400;font-size:26px;line-height:1.25;margin:0;letter-spacing:.01em}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.meter{padding:18px 0 8px}
.big{display:flex;align-items:baseline;gap:8px}
.big .num{font-family:var(--f-disp);font-size:56px;line-height:1;color:var(--accent)}
.big .of{color:var(--muted);font-size:18px}
.big .lab{margin-left:auto;font-weight:700;color:var(--muted);font-size:13px;letter-spacing:.08em}
.stack{display:flex;height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:12px 0 8px}
.stack i{display:block;height:100%}
.stack .m,.legend .m{background:var(--accent)}
.stack .l,.legend .l{background:var(--mid)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--line);display:inline-block}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.facts{display:grid;grid-template-columns:repeat(4,1fr);margin:18px 0 0;border-block:1px solid var(--line)}
.facts div{padding:10px 0;text-align:center}
.facts div+div{border-left:1px solid var(--line)}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--f-mono);font-size:22px;font-weight:500}
.sect{margin:26px 0 8px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:44px;border-radius:10px;text-align:center;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:12px;font-weight:700;text-align:center;padding:0 18px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.4;cursor:default}
.btn small{font-weight:400;opacity:.85;font-size:12.5px}
.startwrap{margin-top:12px}
.rows{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 2px;border-bottom:1px solid var(--line)}
.row .t{flex:1;min-width:0}
.row .t small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4}
.row .n{font-family:var(--f-mono);color:var(--muted);font-size:14px}
.row .chev{color:var(--muted);font-size:18px;line-height:1}
.row[disabled]{opacity:.4;cursor:default}
.mini{width:56px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:none}
.mini i{display:block;height:100%;background:var(--accent)}

/* categories / explanations */
.back{display:inline-flex;align-items:center;min-height:48px;color:var(--accent);font-weight:700;padding-right:16px}
.catline{font-size:13px;color:var(--muted);margin:-2px 0 10px}
.expl{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.expl .lb{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.06em;margin-bottom:2px}
.expl.note{background:transparent;border-style:dashed}
.expl.note .lb{color:var(--muted)}
.h2{font-family:var(--f-disp);font-weight:400;font-size:18px;margin:26px 0 4px;line-height:1.3}
.gh{margin:14px 0 2px;font-weight:700;font-size:14px}
.gh small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:2px}
.gbtn{min-height:44px;color:var(--accent);font-weight:700;font-size:14px}
/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bg);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
#nav button{min-height:48px;border-radius:10px;text-align:center;font-weight:500;color:var(--muted);font-size:14px}
#nav button[aria-current="page"]{color:var(--accent);font-weight:700;background:var(--surface)}
body:not([data-view="main"]) #nav{display:none}
body:not([data-view="main"]){padding-block:8px 24px}

/* quiz */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:52px}
.lnk{color:var(--muted);font-size:15px;min-height:48px;padding-right:16px;justify-self:start}
.cnt{font-size:17px;font-weight:500}
.cnt span{color:var(--muted);font-size:14px}
.flag{justify-self:end;min-width:48px;min-height:48px;font-size:24px;text-align:center;color:var(--line);line-height:1}
.flag.on{color:#E0A000}
.pbar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-bottom:14px}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:8px}
.tag{font-family:var(--f-body);font-weight:700;font-size:11.5px;border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:0 6px;line-height:1.7}
.tag.alt{border-color:var(--muted);color:var(--muted)}
.qtext{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;font-size:22px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.guide{font-size:13px;color:var(--muted);margin:14px 2px 8px}
.chs{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.guide+.chs{margin-top:0}
.ch{display:flex;gap:12px;align-items:flex-start;width:100%;min-height:56px;padding:13px 14px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;overflow-wrap:anywhere;white-space:pre-wrap}
.ch .mk{flex:none;width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:14px;color:var(--muted);margin-top:-1px}
.ch .tx{min-width:0;flex:1}
.ch.sel{border-color:var(--accent)}
.ch.sel .mk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ch.ok{border-color:var(--ok);background:var(--okbg)}
.ch.ok .mk{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.ch.ng{border-color:var(--ng);background:var(--ngbg)}
.ch.ng .mk{background:var(--ng);border-color:var(--ng);color:var(--surface)}
.ch.dim{opacity:.55}
.ch.static{cursor:default}
.res{margin-top:16px;border-radius:12px;padding:12px 14px;font-weight:700}
.res.ok{background:var(--okbg);color:var(--ok)}
.res.ng{background:var(--ngbg);color:var(--ng)}
.res small{display:block;font-weight:500;color:var(--ink);margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere}
.hint{margin-top:12px;border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.hint .lb{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;margin-bottom:2px}
.dock{position:sticky;bottom:0;z-index:8;margin-top:18px;padding:18px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 28%);display:grid;gap:10px}
.dock.two{grid-template-columns:1fr 1fr}
.dock:empty{display:none}

/* result */
.rbig{font-family:var(--f-disp);font-size:56px;line-height:1.1;color:var(--accent);margin:16px 0 4px}
.rbig span{font-size:22px;color:var(--muted)}
.mlist{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--line)}
.mlist li{padding:12px 2px;border-bottom:1px solid var(--line);font-size:14.5px;overflow-wrap:anywhere}
.mlist .a{color:var(--ok);font-weight:500;margin-top:2px;white-space:pre-wrap}
.stk{display:grid;gap:10px;margin-top:20px}

/* list */
.search{width:100%;min-height:48px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:0 14px;font:inherit;font-size:16px;margin-top:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--line);font-size:14px;background:var(--surface);color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.cntl{font-size:12.5px;color:var(--muted);margin:2px 2px 6px}
.it{border-bottom:1px solid var(--line)}
.it summary{list-style:none;display:flex;gap:10px;align-items:center;min-height:56px;padding:8px 2px;cursor:pointer}
.it summary::-webkit-details-marker{display:none}
.it .id{flex:none;width:52px;font-size:13px;color:var(--muted)}
.it .ttl{flex:1;min-width:0;font-size:14.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.l{background:var(--mid)}.dot.m{background:var(--accent)}.dot.w{background:var(--ng)}
.it .bd{padding:4px 2px 16px}
.it .bd .qtext{font-size:15.5px;padding:12px}
.it .chs{gap:8px}
.it .ch{min-height:44px;padding:9px 12px;font-size:15px}
.it .ch.ok .mk{font-size:13px}
.fl{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-top:8px;color:var(--muted);font-size:14px}
.fl.on{color:#B07C00;font-weight:700}
.empty{padding:32px 8px;text-align:center;color:var(--muted)}

/* settings */
.sw{justify-content:space-between}
.knob{flex:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .15s}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-checked="true"] .knob{background:var(--accent)}
.sw[aria-checked="true"] .knob::after{transform:translateX(20px)}
textarea{width:100%;min-height:92px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font-family:var(--f-mono);font-size:12px;line-height:1.5;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pad{margin-top:12px}
.warn{color:var(--ng);border-color:var(--ng)}
.fine{font-size:12.5px;color:var(--muted);margin:8px 2px 0}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* Mac / desktop */
#app.v-quiz .ch .tx{font-size:20px;line-height:1.55}
body{-webkit-font-smoothing:antialiased}
kbd{font-family:var(--f-mono);font-size:11.5px;font-weight:500;line-height:1;padding:3px 6px;border-radius:5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin:0 2px;white-space:nowrap}
.kbhint{display:none;line-height:2}
@media (hover:hover) and (pointer:fine){
  .kbhint{display:block}
  .btn.pri:hover:not([disabled]){filter:brightness(1.1)}
  .btn.sec:hover:not([disabled]),button.ch:hover{border-color:var(--accent)}
  .row:hover:not([disabled]){background:color-mix(in srgb,var(--accent) 8%,transparent)}
  .seg button:not([aria-pressed="true"]):hover,.chips button:not([aria-pressed="true"]):hover,#nav button:not([aria-current]):hover,.lnk:hover{color:var(--ink)}
  .flag:hover{color:#E0A000}
  .it summary:hover .ttl{color:var(--accent)}
}
@media (min-width:900px){
  body{padding-block:72px 48px}
  body:not([data-view="main"]){padding-block:24px 48px}
  #app{max-width:760px}
  #app.t-home{max-width:1000px}
  .hgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 56px;align-items:start}
  #nav{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding-block:8px}
  #nav div{max-width:1000px;display:flex;gap:6px}
  #nav button{min-width:96px;padding:0 20px}
  .chips{flex-wrap:wrap;overflow:visible}
  #app.v-quiz{max-width:980px}
  .qtext{font-size:28px;line-height:1.6;padding:28px 36px;border-radius:20px}
  #app.v-quiz .ch{padding:16px 18px}
  .qmeta{font-size:15px;margin-bottom:12px}
  .guide{font-size:15px}
  .it .bd .qtext{font-size:24px;padding:20px 24px}
  #toast{bottom:32px}
}
@media (min-width:900px){.expl{font-size:17px;padding:16px 20px}.h2{font-size:24px}.gh{font-size:16px}.gh small{font-size:14px}.catline{font-size:15px}}
</style>

<div id="app"></div>
<nav id="nav" aria-label="メニュー"><div></div></nav>
<div id="toast" hidden></div>

<script>
(function(){
'use strict';
var Q=[{"id":1,"q":"セキュリティ専門家の Malachi氏は、受信トラフィックと送信トラフィックを追跡するために組織内にファイアウォールを実装しました。彼は、OSI モデルのセッション層で動作し、ホスト間の TCPハンドシェイクを監視して、要求されたセッションが正当かどうかを判断するファイアウォールを導入しました。上記のシナリオで Malachi によって実装されたファイアウォール テクノロジを特定します。","c":["次世代ファイアウォール (NGFW)","サーキットレベルゲートウェイ","ネットワークアドレス変換 (NAT)","パケットフィルタリング"],"a":[1],"h":"","p":false,"cat":"ネットワーク・FW","g":"ファイアウォールの種類","x":"OSIセッション層で動作し、ホスト間のTCPハンドシェイクを監視してセッションの正当性を判断するのはサーキットレベルゲートウェイです。"},{"id":2,"q":"次のどれが物理的なセキュリティ管理の例ですか?(該当するものをすべて選択してください)","c":["警備員","ファイアウォール","生体認証アクセス制御","暗号化アルゴリズム"],"a":[0,2],"h":"PDF No.2 /No.55","p":false,"cat":"物理セキュリティ","g":"物理セキュリティ対策","x":"物理的な管理策は警備員と生体認証アクセス制御。ファイアウォールと暗号化アルゴリズムは技術的管理策です。"},{"id":3,"q":"攻撃者のマシン I のダウンロード フォルダーにある実行可能ファイルShadowByte.exeを分析し、ファイルのリンカー情報の値を特定します。(実践的な質問)","c":["4.25","2.25","3.5","6.2"],"a":[1],"h":"","p":true,"cat":"実技ラボ","g":"その他ラボ","x":"実行可能ファイルのリンカー情報をPE解析ツールで確認するラボ問題。値そのものを暗記します。"},{"id":4,"q":"ネットワークに接続されたマシンの 1 つに RATが設定されており、サーバーのデスクトップにある重要な機密企業文書を盗みます。さらに調査すると、サーバーの IP アドレスが 20.20.10.26 であることが判明しました。Thiefクライアントを使用してリモート接続を開始し、フォルダー内に存在するファイルの数を確認します。★\n\nヒント: Thief フォルダーは次の場所にあります: Z:\\CCT-Tools\\CCT Module 01 Information","c":["2","4","3","5"],"a":[1],"h":"lab1-1\nC:\\Users\\Administrator\\Documents\\Sensitive Corporate Documents","p":true,"cat":"実技ラボ","g":"RATクライアント","x":"Theefクライアントで20.20.10.26に接続し、File Managerで対象フォルダ内のファイル数を確認します。"},{"id":5,"q":"ライリーはルイに秘密のメッセージを送信しました。メッセージを送信する前に、ライリーは自分の秘密鍵を使用してメッセージにデジタル署名しました。ルイはメッセージを受信し、対応する鍵を使用してデジタル署名を検証し、メッセージが送信中に改ざんされていないことを確認しました。\n\n上記のシナリオでルイがデジタル署名を検証するために使用したキーは次のどれですか?","c":["ライリーの公開鍵","ルイの公開鍵","ライリーの秘密鍵","ルイの秘密鍵"],"a":[0],"h":"","p":false,"cat":"暗号・署名","g":"鍵と署名","x":"デジタル署名は送信者(ライリー)の秘密鍵で署名し、受信者は送信者の公開鍵で検証します。公開鍵は誰でも入手でき、署名者本人しか作れない署名であることを確認できます。"},{"id":6,"q":"組織のネットワーク管理者である Jordanは、ネットワーク関連の問題を特定し、ネットワークパフォーマンスを改善するように指示されました。ネットワークのトラブルシューティング中に、ターゲット ホストで IP 関連サービス (FTP や Web サービスなど)が利用できないためにデータグラムを転送できないことを示すメッセージを受け取りました。\n\nこのシナリオで Jordan が見つけたネットワークの問題は次のどれですか。","c":["時間超過メッセージ","宛先に到達できないメッセージ","到達不可能なネットワーク","ネットワークケーブルが接続されていません"],"a":[1],"h":"","p":false,"cat":"ネットワーク・FW","g":"ICMP・TTL・コマンド","x":"FTPやWebなどIP関連サービスが利用できずデータグラムを転送できない=ICMP『宛先に到達できないメッセージ(Type 3)』です。"},{"id":7,"q":"犯罪捜査官のルーベンは、元のファイルに影響を与えずに、疑わしいメディア内の削除されたファイルとフォルダーをすべて取得したいと考えています。この目的のために、彼はメディア全体のクローン コピーを作成し、元のメディアの汚染を防ぐ方法を使用します。\n\n上記のシナリオで Ruben が使用した方法を特定します。","c":["スパース獲得","ビットストリームイメージング","ドライブの復号化","論理的獲得"],"a":[1],"h":"","p":false,"cat":"フォレンジック","g":"データ取得","x":"メディア全体のクローンを作り、削除済みファイルも含めて取得し元を汚染しない方法はビットストリームイメージングです。"},{"id":8,"q":"攻撃者は、ping-of-death (PoD) 技術を使用して、対象の Androidデバイスをクラッシュさせました。ネットワーク トラフィックは SOCチームによってキャプチャされ、詳細な分析を実行するために提供されました。攻撃者のマシン 2 のドキュメント フォルダーにあるandroid.pcapng ファイルを分析し、PoDパケットの長さ (バイト単位) を特定します。(実践的な質問)","c":["52","56","58","54"],"a":[3],"h":"lab15-1\n●回答方法\nAttacker MachineでWireshark を起動。\n「Applications」→「Penteting」→「Information Gathering」→「Wireshark」\nandroid.pcapngを開き、分析。\n上部の表示フィルタ欄に icmp と入力。\n「Lengh」部分を確認。選択肢の中のバイト数の行がたくさんあるはず。","p":true,"cat":"実技ラボ","g":"Wireshark解析","x":"android.pcapngをWiresharkで開き、表示フィルタにicmpを入力して、PoDパケットのLengthを確認します。"},{"id":9,"q":"あるソフトウェア会社は、従業員の出勤と退勤の時間を記録して勤怠を追跡するワイヤレス技術を導入しました。同社の各従業員は、タグが埋め込まれた入場カードを所持しています。従業員がオフィスの敷地内に入るときはいつでも、入り口でカードをスワイプする必要があります。ワイヤレス技術は、自動識別と物体に取り付けられたタグの追跡のために、無線周波数の電磁波を使用してデータを転送します。\n\n上記のシナリオでソフトウェア会社が実装したテクノロジは次のどれですか","c":["WiMAX","RFID","ブルートゥース","Wi-Fi"],"a":[1],"h":"","p":false,"cat":"無線・モバイル・IoT","g":"近距離無線","x":"無線周波数の電磁波でタグを自動識別・追跡し、カードをかざして使うのはRFIDです。"},{"id":10,"q":"ソフトウェア会社は、安全なアプリケーション開発のベストプラクティスに従って、新しいソフトウェア製品を開発しています。ソフトウェアアナリストの Dawsonは、クライアントのネットワーク内のアプリケーションのパフォーマンスをチェックし、エンドユーザーがアプリケーションにアクセスする際に直面する問題を特定する責任を負っています。安全なアプリケーション開発ライフサイクルの次のどの層でアプリケーションのパフォーマンスのチェックが必要ですか？","c":["開発","ステージング","テスト","品質保証(QA)"],"a":[2],"h":"","p":false,"cat":"アプリ・クラウド・仮想化","g":"SDLC","x":"アプリケーションのパフォーマンスやユーザーが直面する問題を確認するのは『テスト』層です。"},{"id":11,"q":"病院の安全対策として設置されたIoTデバイスがサーバーにアラートを送信しました。ネットワークトラフィックがキャプチャされ、「攻撃者マシン」のドキュメントフォルダに保存されました。\n1. loTdeviceTraffic.pcapng ファイルを分析し、IoTデバイスがネットワーク経由で送信したコマンドを特定します。★","c":["Tempe_Low","Low_Tempe","High_Tempe","Tempe_High"],"a":[1],"h":"PDF No.11 & 22 (問題重複の為,統合）\n問題集では「Tempe_High」が回答となっている\nlab11-1\n●回答方法\nwireshark起動し、「ctrl + F」の検索欄で「frame contains \"Tempe\"」でも行ける。\n検索コマンドで「tcp.port == 1883」→　Publish Messageが出ている部分で\n右クリック「Follow->TCPストリーム」","p":true,"cat":"実技ラボ","g":"Wireshark解析","x":"Wiresharkでframe contains \"Tempe\"、またはtcp.port==1883のPublish Messageを右クリックしてFollow TCP Streamで送信コマンドを確認します。"},{"id":12,"q":"大手銀行機関である Alpha Finance は、新しいモバイル バンキングアプリを立ち上げています。機密性の高い金融データが扱われることから、アプリケーションが最善のセキュリティプラクティスに準拠していることを保証したいと考えています。\n\n主な推奨事項として、Alpha Finance が優先すべきガイドラインは何ですか。","c":["アプリ内にウイルス対策を埋め込む","ユーザーログインに多要素認証 (MFA) を採用する","安全な取引のためにアプリ内VPNを提供する","ユーザーにOSの最新バージョンへのアップデートを促す"],"a":[1],"h":"","p":false,"cat":"データ保護・アクセス制御","g":"認証","x":"金融データを扱うアプリでは多要素認証(MFA)の採用が最優先のガイドラインです。パスワード漏洩があっても突破されにくくなります。"},{"id":13,"q":"ステルス性と高度な技術で知られる APT (Advanced Persistent Threat)グループが、大手ソフトウェア開発会社を標的にしました。この攻撃は、数か月にわたって綿密に計画され、実行されました。アプリケーション レベルとオペレーティング システムレベルの両方で脆弱性が悪用されました。この攻撃により、機密ソースコードが抽出され、開発業務が中断されました。事後分析により、フィッシング、ソフトウェア/ハードウェアの未知/未修正の脆弱性の悪用、ネットワーク内での横方向の移動など、複数の攻撃ベクトルが明らかになりました。この攻撃の性質と実行方法を考慮すると、攻撃者がこの APT を開始するために使用した主な方法は何ですか?","c":["デフォルトのパスワードを悪用してネットワークへの初期アクセスを取得します。","開発者が使用するアプリケーションのゼロデイ脆弱性を悪用します。","ファイアウォールの既知の脆弱性を悪用してネットワーク防御を回避します。","会社の開発環境へのアクセス権を持つサードパーティベンダーを侵害する。"],"a":[1],"h":"","p":false,"cat":"攻撃・脅威・ソーシャル","g":"脅威とマルウェア","x":"APTの初期侵入には、開発者が使うアプリのゼロデイ脆弱性の悪用が該当します。"},{"id":14,"q":"ターゲットウェブサーバーでホストされているウェブアプリケーション（www.movi​​escope.com）は、SQLインジェクション攻撃に対して脆弱です。このウェブアプリケーションを悪用し、moviescopeデータベースからユーザー認証情報を抽出してください。データベース内のユーザー「John」のUID（ユーザーID）を特定してください。注：あなたはこのウェブアプリケーションにアカウントを持っており、認証情報も一致しています。★","c":["3","4","2","5"],"a":[2],"h":"lab2-4\n問題集では「4」が回答となっている\n●回答方法\nAttacker Machine1で「Firefox」起動し、「http://www.movi​​escope.com/」を入力。\n問題分のログイン情報入力。\n「View Profile」アイコンをクリック。\nsam Profileが確認できる。\nここでURLを確認すると、「～viewprofile.aspx/id=1」と確認できる。\n「～viewprofile.aspx/id=1」のID部分を選択肢の数字変更し、「john」を見つける。\n※labだと、下記であることが確認できる。\nid=1　sam\nid=2　 john\nid=3　kety\nid=4　steve\nid=5　lee","p":true,"cat":"実技ラボ","g":"SQLi・プロファイルID","x":"moviescope.comにログインし、View ProfileのURLのid=を変えてjohnを探します。ラボ上は id=2 が John で、選択肢の『2』が正解です(問題集は『4』と記載)。"},{"id":15,"q":"法医学者のカソン氏は、脅迫者がインターネット上で特定の子供をいじめた事件の捜査を任された。事件を法的に進める前に、カソン氏は証拠の出所や事件との関連性など、裏付けとなるすべての文書を文書化し、陪審員の前に提出した。\n\n上記のシナリオでは、次の証拠規則のうちどれが議論されましたか?","c":["本物","理解できる","信頼できる","許容される"],"a":[3],"h":"","p":false,"cat":"フォレンジック","g":"証拠の扱い","x":"出所や事件との関連性など裏付け文書を示し、陪審に提出する=『許容される(admissible)』証拠規則です。"},{"id":16,"q":"セキュリティ専門家のアンドレは、データベースをクライアントと共有する前に、従業員の名前、電話番号、クレジットカード番号を分離する任務を負っていました。この目的のために、彼はデータベース フィールド内の重要な情報をアスタリスク (*) やハッシュ (#)などの特殊文字に置き換えることができる匿名化技術を実装しました。\n\n上記のシナリオでアンドレが使用したテクニックは次のどれですか?","c":["トークン化","マスキング","ハッシュ","バケット化"],"a":[1],"h":"","p":false,"cat":"データ保護・アクセス制御","g":"データ保護手法","x":"重要な情報を*や#などの特殊文字に置き換える匿名化はマスキング。トークン化は別の値(トークン)に置換、ハッシュは不可逆変換、バケット化は値を範囲にまとめます。"},{"id":17,"q":"ネットワークで SSH が有効になっているマシンへの SSH接続を開始します。マシンに接続したら、flag.txtファイルを見つけて、ファイルに隠されたコンテンツを選択します。SSHログインの資格情報は以下に記載されています。★\nヒント：ユーザー名: samパスワード: admin@l23","c":["sam@bob","bob2@sam","bob@sam","sam2@bob"],"a":[2],"h":"lab15-4\nlab14-4\n●回答方法\nAttacker Machineでターミナルを開き、下記コマンドで、SSHサービスが有効なマシンを見つける\n「nmap -p 22 10.10.1.0/24」\nポート 22/tcp open ssh となっているターゲット IP アドレスを特定。\n※下記のように空きがわかる。\nPORT STATE SERVICE\n 22/tcp open ssh\n「ssh sam@xx.xx.xx.xx」→PW:admin@123でログイン。\n「find / -name flag.txt」or「ls -la /」→「cat flag.txt」で画面出力されたものが答え。","p":true,"cat":"実技ラボ","g":"SSHでflag取得","x":"nmap -p 22 10.10.1.0/24でSSH稼働ホストを探し、ssh sam@IP → find / -name flag.txt → cat で内容を確認します。"},{"id":18,"q":"ある組織のインシデント処理および対応 (IH&R) チームは、組織の Webサーバーに対する最近のサイバー攻撃に対処していました。IH&P チームのメンバーであるFernandoは、インシデントの根本原因を排除し、すべての攻撃ベクトルを遮断して、将来同様のインシデントが発生しないようにする任務を負っていました。この目的のために、Fernando はWeb サーバーに最新のパッチを適用し、最新のセキュリティメカニズムをインストールしました。このシナリオで Fernando が実行した IH&Rステップを特定します。","c":["通知","封じ込め","回復","根絶"],"a":[3],"h":"","p":false,"cat":"インシデント対応","g":"IH&Rの段階","x":"Webサーバーに最新パッチを当て、最新のセキュリティ機構を導入=脆弱性の原因を取り除く『根絶』です。"},{"id":19,"q":"ある組織のネットワーク スペシャリストである Zayn は、Wiresharkを使用してネットワーク分析を実行しました。彼は、キャプチャされたパケット、IOグラフ、フロー グラフの概要を提供する Wiresharkメニューを選択しました。このシナリオで Zayn が選択した Wiresharkメニューを特定します。","c":["ステータスバー","分析する","統計","パケットリストパネル"],"a":[2],"h":"","p":false,"cat":"ネットワーク・FW","g":"Wiresharkメニュー","x":"キャプチャパケット・IOグラフ・フローグラフの概要を提供するのは『統計(Statistics)』メニューです。"},{"id":20,"q":"組織のセキュリティ スペシャリストである Wilson は、クラウドネットワークのセキュリティを強化するよう指示を受けました。これを実現するために、Wilson は、オンプレミスの消費者ネットワークとVPC間の通信を集中ユニット経由で確立および管理するネットワーク ルーティングソリューションを導入しました。このシナリオでクラウドネットワークのセキュリティを実現するために Wilson が使用した方法を特定します。","c":["仮想プライベートクラウド (VPC)","パブリックサブネットとプライベートサブネット","トランジットゲートウェイ","VPCエンドポイント"],"a":[2],"h":"","p":false,"cat":"ネットワーク・FW","g":"VPN・クラウド接続","x":"複数のVPC・オンプレミスを中央のハブで接続・管理するルーティング方式はトランジットゲートウェイです。"},{"id":21,"q":"大手ソフトウェア ソリューション プロバイダーの TechTonic は、Windowsベースのサーバー ファームに厳格なサイバーセキュリティ対策を導入しています。最近、システム内で一連の不正なアクティビティが発生していることがわかりましたが、その発生源をたどることはできませんでした。同社は、Windows システムログを包括的に分析することで、監視機能を強化する予定です。潜在的な侵入を追跡することを目的として、Windows ログの洞察力に富んだ効果的な分析を行うには、TechTonicはどの戦略を優先すべきでしょうか","c":["集中ログサーバーを実装し、パターン検出アルゴリズムを使用してログを分析します。","セキュリティ侵害によく関連する Windows イベント ログ ID のみの監視を設定します。","毎週定期的にログをバックアップし、毎月手動でレビューして異常を検出します。","他のログはそれほど重要ではないと想定し、重要なサーバーのログのみに焦点を当てます。"],"a":[0],"h":"","p":false,"cat":"検知(IDS)・ログ・SIEM","g":"SIEM・ログ管理","x":"Windowsログを効率よく分析するには、集中ログサーバーを導入しパターン検出アルゴリズムで分析するのが最善。一部のイベントIDだけ、手動月次レビューは不十分です。"},{"id":22,"q":"ある企業は、機密データを外部からのアクセスから保護するために、社内ファイアウォール内にクラウドインフラストラクチャを実装することを決定しました。この企業は、社内データに対する完全な制御を管理するために、社内にクラウドアーキテクチャを構築することに多額の投資を行いました。このシナリオで、この企業は次のどのタイプのクラウド展開モデルを実装しましたか","c":["マルチクラウド","パブリッククラウド","プライベートクラウド","コミュニティクラウド"],"a":[2],"h":"","p":false,"cat":"アプリ・クラウド・仮想化","g":"クラウド","x":"社内にクラウドアーキテクチャを構築して完全に制御するのはプライベートクラウドです。"},{"id":23,"q":"鑑識官のショーンは、喫茶店で起きた犯罪現場の捜査を任されました。捜査の一環として、ショーンは被害者から、犯人を特定できる証拠が含まれている可能性のあるモバイルデバイスを回収しました。デジタル証拠を保存する際に、ショーンが従うべき点は次のどれですか?(3つ選択してください。)","c":["デバイスの画面表示を記録しない","デバイスがオフの場合はオンにします","デバイスがオンになっている場合は、そのまま放置しないでください。","デバイスが充電されていることを確認してください"],"a":[1,2,3],"h":"","p":false,"cat":"フォレンジック","g":"証拠の扱い","x":"CSV上の正解は2・3・4。モバイル証拠の保全は画面表示を記録し、オンなら放置せず、充電して状態を維持するのが原則です。"},{"id":24,"q":"金融機関から医療提供者まで幅広い顧客を持つ、高く評価されているサイバーセキュリティ企業 Cyber​​X に、NexusCorp がアプローチしました。世界的なサプライチェーン大手のNexusCorpは、一連のサイバー攻撃によって既存のプロトコルの脆弱性が明らかになったことを受けて、新しいセキュリティ ポリシーの起草に協力を求めています。NexusCorpは最先端の技術を使用していますが、セキュリティ ポリシーはそれに追いついていません。複雑な組織構造、広大な地理的広がり、従業員の技術熟練度の多様性を考慮したポリシーが必要です。このシナリオでは、Cyber​​X が主に考慮すべきことは何でしょうか?","c":["ソフトウェアおよびハードウェア コンポーネントの定期的な更新スケジュール。","政策策定における利害関係者の関与。","最新の暗号化アルゴリズムを使用します。","厳格なパスワード ポリシーを重視します。"],"a":[1],"h":"","p":false,"cat":"規格・法規・リスク管理","g":"ガバナンス・ポリシー","x":"複雑な組織・広い地理・技術力の多様性を考慮したポリシー策定では、利害関係者の関与が主な考慮事項です。"},{"id":25,"q":"オンライン ショッピングが大好きなグレースは、デビット カードを使ってスマートテレビを購入しました。オンライン決済中に、グレースのブラウザーは彼女を電子商取引Webサイトからサードパーティの支払いゲートウェイにリダイレクトし、そこで彼女はデビットカードの詳細と、登録した携帯電話で受信した OTPを入力しました。取引を完了した後、グレースはオンライン バンクアカウントに移動し、普通預金口座の現在の残高を確認しました。上記のシナリオで、eコマース Webサイトと支払いゲートウェイ間でデータが処理されるときの状態を特定します","c":["保存データ","非アクティブなデータ","転送中のデータ","使用中のデータ"],"a":[2],"h":"PDF No.26/39","p":false,"cat":"データ保護・アクセス制御","g":"データの3状態","x":"ECサイトと決済ゲートウェイ間でデータが送受信されている状態は『転送中のデータ』。口座残高の参照は保存データです。"},{"id":26,"q":"Aydenは自宅で会社のラップトップを使用して仕事をしています。勤務時間中に、彼のラップトップでウイルス対策ソフトウェアの更新通知を受け取りました。Aydenは更新ボタンをクリックしましたが、システムによって更新が制限され、更新は許可された担当者のみが実行できるというメッセージが表示されました。このシナリオでは、次の PCI-DSS 要件のどれが実証されていますか?","c":["PCI-DSS 要件 5.3","PCI-DSS 要件 1.3.1","PCI-DSS 要件 5.1","PCI-DSS 要件 1.3.2"],"a":[0],"h":"","p":false,"cat":"規格・法規・リスク管理","g":"PCI DSS","x":"更新を許可された担当者のみに制限する=マルウェア対策機構の無効化・改変を防ぐ要件5.3です。"},{"id":27,"q":"Hotel Grandeは豪華な宿泊施設を提供し、ゲストに最高のサービスを提供することに重点を置いています。その 1 つが、すべての部屋で利用できる安全で高速な Wi-Fiアクセスです。ホテルは、セキュリティを損なうことなく、ゲストにシームレスな体験を提供する認証方法を導入したいと考えています。この方法は、利便性と強力なセキュリティのバランスが理想的です。Hotel Grande は次のうちどれを使用すべきでしょうか。","c":["PSK (事前共有キー)","オープン認証","EAP-TLS (拡張認証プロトコル - トランスポート層セキュリティ)","MACアドレスフィルタリング"],"a":[2],"h":"","p":false,"cat":"無線・モバイル・IoT","g":"無線暗号・認証","x":"利便性と強力なセキュリティを両立する認証は、証明書ベースのEAP-TLSです。PSKやMACフィルタは弱く、オープン認証は無防備です。"},{"id":28,"q":"ある大規模な多国籍企業は、セキュリティを強化して機密データを保護するために、ネットワーク インフラストラクチャをアップグレード中です。アップグレードの一環として、ITチームはステートフル マルチレイヤー インスペクションファイアウォールとアプリケーション レベル ゲートウェイファイアウォールの実装を検討しています。\n\nステートフル マルチレイヤー インスペクション ファイアウォールは、パケットフィルタリング機能と検査する OSI モデルのレイヤーの点で、アプリケーション レベルゲートウェイ ファイアウォールとどのように異なりますか?","c":["ステートフル マルチレイヤー インスペクションファイアウォールはより高価であり、管理には有能な人員が必要ですが、アプリケーションレベルのゲートウェイ ファイアウォールは、アプリケーション層でネットワークパケットを評価して有効なデータであるかどうかを確認します","ステートフル マルチレイヤー インスペクションファイアウォールはホスト間のセッション情報を追跡および維持し、アプリケーションレベルのゲートウェイファイアウォールはアプリケーションまたはサービス全体の入力、出力、アクセスを制御します。","ステートフル マルチレイヤー インスペクションファイアウォールはアプリケーション層でのパケットの検査に重点を置いていますが、アプリケーション レベル ゲートウェイファイアウォールは主にネットワーク層でのパケットのフィルタリングを行います。","ステートフル マルチレイヤー インスペクションファイアウォールは、指定されたアプリケーションルール、アプリケーション、またはプロトコルに基づいてトラフィックをフィルタリングしますが、アプリケーション レベル ゲートウェイ ファイアウォールは、ネットワークスタックのレベル 2 までの不明なトラフィックを許可します。"],"a":[1],"h":"","p":false,"cat":"ネットワーク・FW","g":"ファイアウォールの種類","x":"ステートフル・マルチレイヤーインスペクションFWはホスト間のセッション情報(状態)を保持して複数層を検査します。アプリケーションレベルGW(プロキシ)はアプリ層で内容を検査します。"},{"id":29,"q":"ある組織の安全管理者である Juanは、各フロアの入り口に物理的なロックを設置しました。組織の全従業員には IDカードに埋め込まれたスマートカードが割り当てられており、ドアのロックを解除してどのフロアにもアクセスするには、このカードをスワイプする必要がありました。このシナリオで Juanが設置した物理的なロックは次のうちどれですか。","c":["機械式ロック","デジタルロック","コンビネーションロック","電磁ロック"],"a":[1],"h":"","p":false,"cat":"物理セキュリティ","g":"ロックの種類","x":"スマートカードをスワイプしてドアを開ける=デジタルロックです。"},{"id":30,"q":"FTP サーバーのログイン資格情報の John-the-Ripper ハッシュ ダンプは、攻撃者マシン 2のデスクトップに「ターゲット ファイル」として保存されます。ファイル内のパスワードハッシュを解読して、FTP サーバーのログイン資格情報を回復します。FTP ルート ディレクトリにはエクスプロイトファイルがホストされています。エクスプロイトファイルを読み、エクスプロイトの作成者の名前を回答として入力してください。\nヒント:すべての資格情報で FTP にアクセスできるわけではありません。(実用的な質問)","c":["バイトディフェンダー","コードガード","キュー暗号シールド","セキュリティなし"],"a":[3],"h":"lab12-1","p":true,"cat":"実技ラボ","g":"その他ラボ","x":"FTP上のエクスプロイトファイルを読み、作成者名を確認するラボ問題です。"},{"id":31,"q":"多国籍企業のSOC部門は、セキュリティイベントのログを収集しました。「Windows.events.evtx」。「Attacker Maehine1」のドキュメントフォルダにあるイベントログファイル内の監査失敗ログを調べ、攻撃者のIPアドレスを特定してください。★（注：監査失敗ログのイベントIDは4625です。）","c":["10.10.1.12","10.10.1.10","10.10.1.16","10.10.1.19"],"a":[2],"h":"lab16-1\n●回答方法\nスタートアイコンを右クリックし、次に「Event Viewer」をクリックして開く。\n左側のペインで「Windows logs」 を展開。→「Security」をクリック。\n右側のペインで、「Filter Current Log…」をクリックし、\nイベントIDは4625を検索。\n「全般（General）」 タブでSource Network Addressの項目を確認するか、\n 「詳細（Details）」タブで下部に記載のある、 IpAddressの項目を確認。","p":true,"cat":"実技ラボ","g":"その他ラボ","x":"Event Viewerでセキュリティログをイベント ID 4625で絞り、Source Network Address(IpAddress)を確認します。"},{"id":32,"q":"法医学チームのメンバーである Danyは、オンライン犯罪の捜査プロセスに積極的に関与していました。Danyの主な職務には、捜査の実施に関する法的助言の提供と、法医学捜査プロセスに関連する法的問題への対処が含まれていました。上記のシナリオで Danyが果たした役割を特定してください","c":["弁護士","インシデントアナライザー","専門家証人","インシデント対応者"],"a":[0],"h":"","p":false,"cat":"フォレンジック","g":"捜査チーム・報告書","x":"捜査に関する法的助言を行い、法的問題に対処する役割は弁護士です。"},{"id":33,"q":"ある組織のセキュリティ チーム メンバーである Walker 氏は、展開されたクラウドサービスが期待どおりに動作しているかどうかを確認するよう指示されました。彼は、客観的な証拠をレビューして標準に準拠していることを確認するために、クラウド サービスコントロールの独立した検査を実施しました。さらに、Walker 氏は、セキュリティコントロール、プライバシーへの影響、およびパフォーマンスに関して、CSPが提供するサービスを評価しました。上記のシナリオでウォーカーが果たした役割を特定します。","c":["クラウド監査人","クラウドプロバイダー","雲のキャリア","クラウド消費者"],"a":[0],"h":"","p":false,"cat":"アプリ・クラウド・仮想化","g":"クラウド","x":"CSPのサービスのセキュリティ・プライバシー・パフォーマンスを独立して評価する役割はクラウド監査人です。"},{"id":34,"q":"集中ログ管理のために、最近買収した子会社の Linux マシンと会社の Windows環境の統合を担当するシステム管理者として、最も大きな課題は何でしょうか?","c":["両方のシステムによって生成される膨大な量のログを処理します。","組み込みログ ビューアーのさまざまなユーザー インターフェイス(イベント ビューアーと Syslog) をナビゲートします。","Windows と Linux の両方のログ管理ツールに精通した熟練した人材を見つける。","Windows システムと Linux システムで使用されるログ形式の非互換性を管理します。"],"a":[3],"h":"","p":false,"cat":"検知(IDS)・ログ・SIEM","g":"SIEM・ログ管理","x":"Linux(syslog系)とWindows(EVTX)ではログ形式に互換性がなく、集中管理での最大の課題は形式の非互換を吸収することです。"},{"id":35,"q":"ステラはデビットカードを使用してオンラインでスマートウォッチを購入しました。決済ゲートウェイを通じて商品の支払いを済ませた後、銀行から引き落とされた残高と利用可能残高を記載した取引テキスト メッセージを受け取りました。このシナリオで、ステラの取引ステータスが彼女の銀行口座に即座に反映されることを保証する情報セキュリティ要素を特定します。","c":["否認防止","誠実さ","可用性","機密性"],"a":[2],"h":"","p":false,"cat":"データ保護・アクセス制御","g":"CIA+否認防止","x":"取引状況が即座に口座へ反映される=必要な時に使える状態を保つのは可用性です。"},{"id":36,"q":"ある組織のセキュリティ専門家であるマイルズ氏は、従業員全員が遠隔地から業務プロセスを実行できるように、ラップトップを支給しました。業務に必要なアプリケーションをインストールすると同時に、マイルズ氏は会社のポリシーに従って、インターネット経由の外部の悪意あるイベントを検出してマシンを保護するために、各ラップトップにウイルス対策ソフトウェアもインストールしました。\n\n上記のシナリオで Myles が従う PCI-DSS 要件を特定します。","c":["PCI-DSS requirement no 1.3.2","PCI-DSS requirement no 1.3.5","PCI-DSS requirement no 5.1","PCI-DSS requirement no 1.3.1"],"a":[2],"h":"","p":false,"cat":"規格・法規・リスク管理","g":"PCI DSS","x":"ウイルス対策ソフトを導入して外部からの悪意あるイベントを検出する=要件5.1です。"},{"id":37,"q":"多国籍テクノロジー複合企業 GlobalTech は、過去 20 年間、50か国で事業を展開してきました。最近、同社は重大なデータ侵害に直面し、評判と収益に影響を及ぼしました。その結果、取締役会は既存の企業戦略を全面的に見直し、情報セキュリティガバナンスの強化に重点を置くことを決定しました。同社は、堅牢なガバナンス構造は将来の侵害を防ぐだけでなく、テクノロジー市場での拡大と優位性という長期的なビジネス目標にも合致すると考えています。同社は、複合企業の独自の立場に最適な戦略を提案するために、複数のサードパーティ コンサルタントに依頼しました。GlobalTech の要件に最も適合する戦略はどれですか?","c":["堅牢な侵入検知システムを実装します。","四半期ごとのレビューでセキュリティ監査を優先します。","セキュリティ上の考慮事項をすべてのビジネス上の意思決定に統合するガバナンス フレームワークを確立します。","サイバーセキュリティタスク用の独立したチームを編成します。"],"a":[2],"h":"","p":false,"cat":"規格・法規・リスク管理","g":"ガバナンス・ポリシー","x":"セキュリティの考慮事項をすべての事業判断に統合するガバナンスフレームワークが、複合企業に最も適合します。"},{"id":38,"q":"SQL インジェクション攻撃を防ぐのに役立つセキュリティ対策はどれですか?(該当するものをすべて選択してください)","c":["入力検証","クロスサイトスクリプティング（XSS）","弱いパスワードの使用","コードの難読化"],"a":[0],"h":"","p":false,"cat":"アプリ・クラウド・仮想化","g":"安全なアプリ","x":"SQLインジェクション対策は入力検証です。XSS・弱いパスワード・難読化は対策になりません。"},{"id":39,"q":"フォレンジック担当官の Gideonは、オンライン犯罪活動に関与している疑いのある被害者のLinuxシステムを調べていました。Gideonは、ユーザーのログイン/ログアウトに関する情報を記録したログファイルを含むディレクトリに移動しました。この情報により、Gideonは被害者のシステムにおけるサイバー犯罪者の現在のログイン状態を判断し、このシナリオで Gideon がアクセスしたLinux ログ ファイルを特定できました。","c":["/var/log/mysqId.log","/var/log/wtmp","/var/log/boot.iog","/var/log/httpd"],"a":[1],"h":"","p":false,"cat":"フォレンジック","g":"Linuxログ","x":"ログイン状態(ログイン履歴)を記録するのは/var/log/wtmp。lastコマンドの元データです。"},{"id":40,"q":"政府機関の機密情報が一般に漏洩し、重大な恥辱と評判の失墜を引き起こしました。漏洩したデータには、軍事作戦や外交通信に関する機密文書が含まれています。このシナリオを考慮すると、他の政府機関や軍事組織に侵入して極秘情報を収集するために政府が通常雇用する脅威アクターグループはどれでしょうか。","c":["犯罪組織","産業スパイ","国家支援のハッカー","スクリプトキディ"],"a":[2],"h":"","p":false,"cat":"攻撃・脅威・ソーシャル","g":"脅威とマルウェア","x":"他国の政府・軍事組織に侵入して機密を収集するのは国家支援のハッカーです。"},{"id":41,"q":"多国籍企業のセキュリティ専門家である Lorenzo は、リモート アクセスサーバー用の集中認証、承認、アカウンティングを確立するように指示されました。この目的のために、彼はクライアント サーバー モデルに基づき、OSIモデルのトランスポート層で動作するプロトコルを実装しました。上記のシナリオで Lorenzo が採用したリモート認証プロトコルを特定します。","c":["SNMPv3","RADIUS","POP3S","IMAPS"],"a":[1],"h":"","p":false,"cat":"ネットワーク・FW","g":"プロトコル・通信","x":"クライアントサーバモデルで動作するリモート認証プロトコルはRADIUS(AAA)。SNMPv3は管理、POP3S/IMAPSはメールです。"},{"id":42,"q":"システム管理者の Ryleighは、定期的に組織データの完全バックアップを実行するように指示されました。この目的のために、彼女は、従業員がシステムにアクセスしていない固定日、つまりサービスレベルのダウンタイムが許容されるときに完全バックアップを実行するというバックアップ手法を使用しました。上記のシナリオで Ryleigh が使用したバックアップ手法を特定します。","c":["ニアラインバックアップ","コールドバックアップ","ホットバックアップ","ウォームバックアップ"],"a":[1],"h":"","p":false,"cat":"BCP・DR・バックアップ","g":"バックアップ手法","x":"サービス停止が許される固定日にシステムを止めて完全バックアップを取る方式はコールドバックアップです。"},{"id":43,"q":"仮想化ソフトウェア エンジニア/アナリストとして、Alpha Inc.社のプロジェクトに携わっています。OS 仮想化は、物理/ベース OS とハイパーバイザーOS の分離に使用されます。分離の観点から見た OS仮想化のセキュリティ上の利点は何ですか?","c":["仮想マシンは、同じホスト上の他の仮想マシンのリソースに自由にアクセスできます。","仮想マシンは互いに分離されているため、1つの仮想マシンのセキュリティ侵害が他の仮想マシンに影響することを防ぎます。","侵害された仮想マシンは、物理ホストや他の仮想マシンに簡単に感染する可能性があります。","OS 仮想化は単独ではセキュリティ上の利点を提供しません。"],"a":[1],"h":"","p":false,"cat":"アプリ・クラウド・仮想化","g":"仮想化","x":"仮想マシン同士は分離されているため、1つの侵害が他のVMに及びにくいのが利点です。"},{"id":44,"q":"組織のセキュリティ専門家である Finley は、SIEMダッシュボードを通じて組織のネットワーク動作を監視する任務を負っていました。監視中に、Finley はネットワーク内で疑わしいアクティビティに気付きました。そこで、1つのネットワークパケットをキャプチャして分析し、シグネチャに悪意のあるパターンが含まれているかどうかを判断しました。\n\nこのシナリオで Finleyが使用した攻撃シグネチャ分析手法を特定します。","c":["コンテキストベースのシグネチャ分析","アトミック署名ベースの分析","複合シグネチャベースの分析","コンテンツベースの署名分析"],"a":[1],"h":"","p":false,"cat":"検知(IDS)・ログ・SIEM","g":"シグネチャ分析","x":"単一のネットワークパケットで悪意のあるパターンかを判定する手法はアトミックシグネチャベース分析です。"},{"id":45,"q":"ある組織のセキュリティ専門家であるリチャーズ氏は、IDSシステムを監視していました。監視中に、組織のネットワークへの侵入試行が進行中であるという警告が突然届きました。彼はすぐに必要な対策を講じて、悪意のある行為を回避しました。\n\n上記のシナリオで IDS システムによって生成されたアラートの種類を識別します。","c":["トゥルーポジティブ(true positive)","トゥルーネガティブ(true negative)","フォルスネガティブ(false negative)","フォルスポジティブ(true negative)"],"a":[0],"h":"●ヒント\nトゥルーポジティブ\n[攻撃 - アラート]\nトゥルーネガティブ\n[攻撃なし - アラートなし]\nフォルスネガティブ\n[攻撃 - アラートなし]\nフォルスポジティブ\n攻撃なし - アラート","p":false,"cat":"検知(IDS)・ログ・SIEM","g":"アラート種別","x":"実際の攻撃があり、IDSが警告した=トゥルーポジティブ。攻撃あり/警告なしは偽陰性(見逃し)、攻撃なし/警告ありは偽陽性です。"},{"id":46,"q":"10,000 人以上の従業員を抱える多国籍企業 GlobalTech では、従業員の間でモバイルデバイスの使用が急増しています。IT部門は、データのセキュリティだけでなく、デバイス選択の柔軟性を提供し、管理オーバーヘッドを低く抑える堅牢なモバイルセキュリティ管理ソリューションを導入する任務を負っています。\n\nGlobalTechにとって最適なソリューションは次のどれでしょうか。","c":["モバイル アプリケーション管理 (MAM)","モバイルデバイス管理 (MDM)","統合エンドポイント管理 (UEM)","コンテナ化ソリューション"],"a":[2],"h":"","p":false,"cat":"無線・モバイル・IoT","g":"モバイル管理","x":"デバイス選択の柔軟性と低い管理負荷を両立する統合的なソリューションは統合エンドポイント管理(UEM)です。"},{"id":47,"q":"新興企業には、フロア全体に渡ってワイヤレスネットワークに接続されたさまざまなデバイスがあります。インターネット接続を備えたAP が隅に配置され、デバイス間のワイヤレス通信が可能になります。APS範囲を超えてネットワークに接続された新しいデバイスをサポートするために、管理者はワイヤレス AP の信号を拡張してカバーされていない領域に送信するネットワークデバイスを使用しました。\n\nこのシナリオで管理者が信号を拡張するために使用したネットワーク コンポーネントを特定します。","c":["ワイヤレスリピーター","ワイヤレスブリッジ","ワイヤレスモデム","ワイヤレスルーター"],"a":[0],"h":"","p":false,"cat":"ネットワーク・FW","g":"ネットワーク機器","x":"APの信号を拡張し、未カバー範囲へ届けるのはワイヤレスリピーター。ブリッジはネットワーク同士の接続です。"},{"id":48,"q":"組織のネットワーク管理者である Martinは、アプリケーションの侵害アラートを受け取りました。彼は、アプリケーションの脆弱性により、攻撃者が悪意のある入力を行えることを突き止めました。Martinは、この脆弱性によって引き起こされる可能性のある脅威の重大度と損害の範囲を評価しました。次に、適切な緩和戦略を決定するために、問題をセキュリティ管理チームにエスカレーションしました。\n\nMartinが脅威の重大度レベルを評価したのは、次のどの脅威モデリング手順ですか。","c":["脆弱性を特定する","アプリケーションの概要","リスクと影響の分析","アプリケーションを分解する"],"a":[2],"h":"","p":false,"cat":"規格・法規・リスク管理","g":"リスク管理","x":"脅威の重大度と損害の範囲を評価する=脅威モデリングの『リスクと影響の分析』ステップです。"},{"id":49,"q":"ある世界的な金融機関が、数か月にわたって内部ネットワークにアクセスし機密データを盗み出すという高度なサイバー攻撃を受けました。この攻撃は複雑で、フィッシング、マルウェア、システムの脆弱性の悪用が混在していました。攻撃が発覚すると、金融機関はインシデント対応プロセスを開始しました。インシデントの性質と重大性を考慮すると、インシデント対応チームの最初の取り組みの主な焦点は何であるべきでしょうか。","c":["侵害に関する広報と顧客とのコミュニケーションを管理するためのコミュニケーション計画を実施する","法規制の要件を遵守するために、法執行機関や規制機関に直ちに通知する","影響を受けたシステムを隔離してさらなるデータ流出を防ぎ、ネットワークトラフィックの異常を分析する","包括的なシステム監査を実施してすべての脆弱性を特定し、直ちに修正する"],"a":[2],"h":"","p":false,"cat":"インシデント対応","g":"初動対応","x":"侵害の最初の取り組みは、影響を受けたシステムの隔離によるデータ流出の阻止と異常トラフィックの分析です。"},{"id":50,"q":"セキュリティインシデントで、フォレンジック調査により「security_update.exe」という疑わしいファイルが分離されました。「Attacker Machine-1」のドキュメントフォルダーにあるファイルを分析して、悪意のあるファイルかどうかを判断するように求められます。★\n\n疑わしいファイルを分析して、マルウェアシグネチャを特定します。(実践的な質問)","c":["スタックスネット (Stuxnet)","クレズ（KLEZ）","ゼウス（ZEUS）","コンフィッカー（Conficker）"],"a":[1],"h":"lab17-2\n問題集では「スタックスネット(Stuxnet)」が回答となっている\n●ヒント\n「Stuxnet」は、産業制御システム（ICS）を標的とするワームのマルウェアシグネチャです。\n　→Stuxnetは、ICSのコードや動作を改変することで、システムの妨害や損傷を引き起こす可能性があります。\n「KLEZ」は、電子メールやネットワーク共有を介して拡散するワームのマルウェアシグネチャです\n　→KLEZは、ファイルの感染や上書き、ウイルス対策ソフトの無効化、偽メッセージの表示などに利用されることがあります。\n「ZEUS」は、銀行や金融システムを標的とするトロイの木馬のマルウェアシグネチャです。\n　→ZEUSは、銀行の認証情報の盗難や改変、不正取引の実行、他のマルウェアのインストールなどに利用されることがあります。\n「Conficker」は、Windowsオペレーティングシステムの脆弱性を悪用するワームのマルウェアシグネチャです。\n　→Confickerは、ボットネットの構築、セキュリティサービスの無効化、他のマルウェアのダウンロードなどに利用されることがあります。\n●回答方法\nhttps://www.virustotal.com/#/home/upload\n上記を、FireFoxかchromeで検索。\nサイトのFile選択部分で、対象の「.exe」ファイルを選択。","p":true,"cat":"実技ラボ","g":"その他ラボ","x":"疑わしいファイルを分析してマルウェアシグネチャを判定するラボ。CSV正解はKLEZ(問題集ではStuxnetと記載)。"},{"id":51,"q":"堅牢な Linux インフラストラクチャを備えた企業である NexaCorpは、明らかな理由もなく継続的にダウンタイムに直面しています。同社の初期調査では、システム レベルの不正な変更の可能性が示唆されています。NexaCorp の IT チームは、原因を正確に特定するために、システムログをより効率的に監視および分析する必要があることを認識しています。\n\nNexaCorp がLinux システムログを監視および分析して、不正な変更を検出し防止するための最適なアプローチは何でしょうか。","c":["異常なアクティビティがないか、毎日 /var/)og/syslog ファイルを監視して分析します。","最後のコマンドで予期しないユーザーが表示された場合にアラートを送信する自動スクリプトを設定します。","ログをリアルタイムで集中管理、相関、分析する SIEM システムを実装します","ほとんどの変更はリモート アクセスを通じて行われる可能性が高いため、SSHログの監視のみに焦点を当てます"],"a":[2],"h":"","p":false,"cat":"検知(IDS)・ログ・SIEM","g":"SIEM・ログ管理","x":"ログをリアルタイムに集中管理・相関分析・アラートできるSIEMの導入が、不正な変更の検知・防止に最適です。"},{"id":52,"q":"システム管理者の Giovanniは、新しいプロジェクトに携わる従業員の権限を構成する任務を負いました。組織では、リソースへの権限を付与/拒否するために Active Directory (AD) を使用していました。Giovanniは、必要な権限を持つ ADユーザー用のフォルダーを作成し、新しいプロジェクトに携わるすべての従業員をそのフォルダーに追加しました。\n\nこのシナリオで Giovanniが作成したアカウントの種類を特定します。","c":["サードパーティアカウント","クループベースのアカウント","共有アカウント","アプリケーションアカウント"],"a":[1],"h":"","p":false,"cat":"データ保護・アクセス制御","g":"アカウント種別","x":"ADでプロジェクト用のフォルダを作り、メンバーをまとめて追加=グループ単位で権限を管理するグループベースのアカウントです。"},{"id":53,"q":"IP アドレス 172.30.20.110 にある Androidデバイスの脆弱性評価を実行します。デバイスの重大度スコアを特定します。このチャレンジでは、Parrot Security で利用可能な OpenVAS 脆弱性スキャナーを、資格情報admln/password で使用できます。(実践的な質問)","c":["2.2","2.8","2.6","2.4"],"a":[1],"h":"lab6-4\n●回答方法\nAttacker Machineで\nデスクトップウィンドウ上部の「Applications」→「Pentesting」\n→「Vulnerability Analysis」→「Openvas - Greenbone」→「Start」でGreenboneを起動。\n→ログイン情報入力し、初期化を待つ。　sudo openvas-start\nFirefoxブラウザを起動し、https://127.0.0.1:9392と入力してGreenboneを起動。\n上部の「scans」タブ→「tasks」。左上の「魔法の杖」アイコンから「Task Wizard」を\n開き、対象のIPアドレスを入力し、「Start Scan」を押す。\n※スキャンには20分くらいかかる。。。\nスキャン後は、対象のステータスの「Done」をクリックし、「Results」タブを開く。\n→デバイスの重大度スコア特定の場合は、対象の「Severity」を確認。","p":true,"cat":"実技ラボ","g":"OpenVAS脆弱性スキャン","x":"Greenbone(OpenVAS)でTask Wizardから対象IPをスキャンし、Resultsでデバイスの重大度スコアを確認します。"},{"id":54,"q":"ある組織の IH&Rチームのメンバーであるウォーレンは、組織のネットワークに接続されたサーバーの 1つに対して実行されたマルウェア攻撃に対処する任務を負っていました。彼は、感染が組織の他の資産に広がるのを防ぎ、組織へのさらなる被害を防ぐために、すぐに適切な対策を実施しました。\n\n上記のシナリオで Warren が実行した IH&R ステップを特定します。","c":["封じ込め","回復","根絶","インシデントのトリアージ"],"a":[0],"h":"","p":false,"cat":"インシデント対応","g":"IH&Rの段階","x":"感染が他の資産へ広がるのを防ぐ=『封じ込め』です。"},{"id":55,"q":"あなたは、Vector Inc.という多国籍企業でハイパーバイザーと仮想化ソフトウェアに携わっています。オペレーティング システム (OS) の仮想化を使用しており、OS の仮想化に関連するセキュリティリスクに対処する必要があります。\n\nこれらのセキュリティリスクをどのように軽減できますか?","c":["上記のすべて","VM を管理するユーザーに対して最小権限のアクセス制御を実装します。","セキュリティ修正のために、ハイパーバイザー ソフトウェアに定期的にパッチを適用して更新します。","パフォーマンスを向上させるために、仮想マシンのセキュリティ機能を無効にします。"],"a":[2],"h":"","p":false,"cat":"アプリ・クラウド・仮想化","g":"仮想化","x":"CSV上の正解は『ハイパーバイザーへの定期的なパッチ適用』。最小権限も有効ですが、セキュリティ機能の無効化は誤りです。"},{"id":56,"q":"大手フィンテック企業のシニア ネットワークアナリストとして、あなたは会社のグローバルオフィス間のシームレスな通信を確保する任務を負っています。ネットワークは冗長性を考慮して構築されており、複数のサービス プロバイダーとMPLS およびパブリックインターネット接続の組み合わせを活用しています。最先端のネットワークパフォーマンス監視および診断 (NPMD) ツールを導入してから 1週間後、ヨーロッパのデータセンターからニューヨークの本社をターゲットとした異常なトラフィックパターンに気付きました。トラフィックは定期的に急増し、MPLSリンクを大量に使用し、パブリックインターネット接続が飽和状態になることもあり、その結果、重大なデータパケット損失とアプリケーション障害が発生します。\n\nあなたの任務は、これらのトラフィック異常の根本原因を特定し、すべての重要なビジネス オペレーションで最適なネットワークパフォーマンスを確保することです。このシナリオでは、これらのトラフィック急増の主原因は何である可能性があり、すぐにとるべき対応策は何でしょうか。","c":["・MPLSリンクのフラッピングMPLSリンクでフラッピングが発生し、トラフィックフローが不安定になっている可能性があります。MPLSサービスプロバイダーと連携してリンクの安定性を確認し、トラフィックを再ルーティングするためのバックアップリンクまたは代替ルートを検討することが重要です。","・不正なアプリケーションの使用ヨーロッパのデータセンターのスタッフが、大量の帯域幅を消費する不正なアプリケーションやサービスを使用している可能性があります。厳格なアプリケーションおよびネットワークアクセス制御ポリシーを適用し、アプリケーショントラフィックを精査して、ビジネスクリティカルでないアプリケーションの使用を制限する必要があります。","・データのバックアップとレプリケーションヨーロッパのデータセンターでは、ピーク時間帯にデータのバックアップまたはレプリケーション処理が実行されている可能性があります。データセンターチームと連携し、バックアップ処理をピーク時以外の時間帯に再スケジュールし、帯域幅を考慮したバックアップ処理が行われるようにしてください。","・ネットワークハードウェアの故障ヨーロッパのデータセンターのネットワークハードウェア（ルーターやスイッチなど）に不具合があり、トラフィックのバーストが不安定になっている可能性があります。ハードウェアの診断、障害の確認、そして故障した機器の交換を直ちに行う必要があります。"],"a":[2],"h":"","p":false,"cat":"BCP・DR・バックアップ","g":"障害時の判断","x":"ピーク時間帯のデータバックアップ・レプリケーションが帯域を大量消費したことがトラフィック急増の原因として最も可能性が高い、というのがCSVの正解です。"},{"id":57,"q":"サイバーセキュリティ技術者として、最近攻撃を受けたデバイスからキャプチャされたLinux イメージのファイル システムを分析する任務を負っています。「Attacker Machine1」のドキュメント フォルダーにあるフォレンジックイメージ「Evidenced.img」を調べ、イメージファイルからユーザーを特定します。(実践的な質問)","c":["smith","roger","john","stan"],"a":[1],"h":"本問題は参考程度となる\nPDFの選択肢も不明確のため\n以下、PDFの回答\nA.スミス\nB.攻撃者 〇\nC.了解\nD.ジョン\nとなっているが、手書きで「roger」が答えとなっている。\nlab18-6\n●回答方法\nAccessData FTK Imagerを起動。\nメニューの 「File」 ＞ 「Add Evidence Item...」 を選択。\nポップアップの「Image File」にチェックを入れて、次へ。\n参照(Browse…)をクリックして、対象のイメージファイルを選択し、完了。\n左側の Evidence Tree パネルでイメージを展開し、\n「root」＞ 「etc」 フォルダを開き、右上のリストから 「passwd」 ファイルをクリックします。\n画面下部に表示が出るので、内容を確認する。\n※本番では、/etc/passwdが確認できるらしい。。。","p":true,"cat":"実技ラボ","g":"その他ラボ","x":"FTK ImagerでEvidenced.imgを開き、root > etc > passwdの内容からユーザーを確認します(CSV正解)。"},{"id":58,"q":"あなたは、内部関係者が画像ステガノグラフィーを使用して競合他社に機密情報を送信した疑いのあるデータ漏洩事件を調査しています。また、容疑者から VeraCrypt ボリュームファイル S3cr3t を回復しました。VeraCrypt ボリューム ファイルは、Attacker Machined のPictures フォルダーにあります。あなたの仕事は、VeraCryptボリュームをマウントし、画像ファイルを見つけて、ファイルに隠された秘密コードを回復することです。答えとしてコードを入力してください。ヒント: 必要に応じて、VeraCryptボリューム ファイルをマウントするためのパスワードとしてsniffer@123を使用してください。(実践的な質問)","c":["L76D2E8CBA1K","H364F9F4FD3H","J782C8C2EH6J","G85E2C7AB1R6"],"a":[1],"h":"lab12-7\nlab13-2\n●回答方法\n・lab13-2の場合\nデスクトップの「VeraCrypt」を起動。\n適当な空きDriveを選択し、「Select File...」をクリックして Pictures/S3cr3t ファイルを指定。\nMount ボタンを押し、パスワード入力を求められたらヒントのパスワードを入力。\nボリュームが正常にマウントされ、ドライブが開ける状態になる。\n・lab12-7の場合\nデスクトップやアプリケーション一覧から OpenStego を起動。\n※必要に応じて、setupから。\n画面左側のメニューで「Data Hiding」内の Extract Data（データの抽出）を選択。\n「Input Stego File」にVeraCryptでマウントしたドライブ内にある画像ファイルを選択。\n「Output Folder for Message File」は、抽出されたtxtファイルを保存する場所。\n※デスクトップでいいと思う。\n「Password」欄にはパスワードとして sniffer@123を使用。\n「Extract Data」ボタンを押せば、データが抽出されるはず。\n作成されたテキストファイルを開き、中のコードを確認。","p":true,"cat":"実技ラボ","g":"暗号・ハッシュ・ステガノ","x":"VeraCryptでボリュームをマウントし、必要に応じOpenStegoで隠しデータを抽出してコードを確認します。"},{"id":59,"q":"最近、自宅用にスマート サーモスタットを購入しました。これにより、モバイルアプリからリモートで温度を制御できます。新しいスマートサーモスタットのセキュリティを考慮すると、不正アクセスから保護するのに最も効果が低いのは次のうちどれでしょうか。","c":["製造元からの最新のセキュリティ パッチを使用して、サーモスタットのファームウェアを最新の状態に保ちます。","サーモスタットを自宅の「ゲスト」Wi-Fi ネットワークに接続したままにしておくと、すべてのゲストが利用できるようになります。","初期セットアップ時にモバイル アプリとサーモスタットのデフォルトのパスワードを変更します。","安全なホーム Wi-Fi ネットワーク上でのみサーモスタットへのリモート アクセスを有効にします"],"a":[1],"h":"","p":false,"cat":"無線・モバイル・IoT","g":"IoT・OT","x":"ゲストWi-Fiは複数の人が共有する信頼度の低いネットワーク。サーモスタットをそこに接続したままにするのは保護効果が最も低い対策です。"},{"id":60,"q":"ある組織のネットワーク スペシャリストである Leilani は、ネットワークトラフィックの監視にWireshark を使用しました。Leilaniは、フィルターの操作、表示、適用、プロトコルの分析の有効化または無効化、ユーザー指定のデコードの設定を行う項目が含まれる Wireshark メニュー アイコンに移動しました。上記のシナリオで Leilani が移動した Wireshark メニューを特定します。","c":["統計","キャプチャ","メインツールバー","分析する"],"a":[3],"h":"","p":false,"cat":"ネットワーク・FW","g":"Wiresharkメニュー","x":"プロトコル解析の有効化/無効化やユーザー指定デコードの設定項目があるのは『分析(Analyze)』メニューです。"},{"id":61,"q":"ネットワーク内のマシンの 1 つに FTP サーバーがホストされています。攻撃者は Cain とAbel を使用してマシンを汚染し、管理者が使用する FTP 資格情報を取得できました。\n\nCainと Abel を使用して盗まれた資格情報を検証し、ファイル flag.txtを読み取るタスクが与えられます","c":["white@hat","red@hat","hat@red","blue@hat"],"a":[2],"h":"lab2-1\n●回答方法\nAdmin Machineかな？で、「Cain & Abel」を起動。\n上部タブの「Sniffer」タブを選択。→「Start/Stop Sniffer」アイコンをクリック。\n下部の「passwrods」タブを選択し、「FTP」を選択。\n「Configure」アイコンをクリックし、「OK」。「+」アイコンをクリックして、スキャン対象のホストを追加\n「All hosts in my subnet」オプションを選択し、「OK」。\nホストがリストに表示されるのを待ち、\n「20.20.10.26」（FTPサーバー）を右クリックし、「Resolve Host Name」オプションを選択。\nホスト名「ftpserver.movi​​eabc.com」を控えておく。\n「Passwords」タブをおし、「+」アイコンをクリックして、リストに追加。\nコマンドプロンプトで「ftp xx.xx.xx.xx」※xx.xx.xx.xxは、FTPサーバのアドレス。\n20.20.10.26らしい。。。　\n「Cain & Abel」で確認したログイン情報を元にログイン。\n「ls」でflag.txtの存在を確認。\n「get flag.txt」でローカルに落とす。\nあとは、エクスプローラーから中身を確認するか、FTP接続を終了(quit)し、\nコマンドプロンプトで「type flag.txt」で直接中身をみて回答。","p":true,"cat":"実技ラボ","g":"その他ラボ","x":"Cain & AbelでFTP資格情報を取得・検証し、ftpでログインしてflag.txtを読むラボです。"},{"id":62,"q":"高度なサイバーセキュリティ研究室では、チームが機密性の高い通信を保護するための新しい暗号化プロトコルの開発に取り組んでいます。彼らの目標は、現在の多くの暗号化方式を破る可能性のある量子コンピューティング攻撃に対して耐性のあるプロトコルを作成することです。研究中、彼らはプロトコルでのハッシュ関数の使用に焦点を当てています。チームは、最高レベルのセキュリティを確保するためにさまざまなハッシュ関数を試しています。\n\n量子コンピューティングの脅威を考慮すると、次のハッシュ関数のうち、プロトコルに最も適切なものはどれでしょうか。","c":["SHA-256。広く使用されており、セキュリティ実績が証明されているため","ハッシュ値を生成する際の速度と効率に優れたMD5","HMAC。データの整合性と認証を提供する機能のため","SHA-3。量子コンピューティング攻撃に耐性を持つように設計されている。"],"a":[3],"h":"","p":false,"cat":"暗号・署名","g":"暗号方式の使い分け","x":"SHA-3は量子計算機への耐性も考慮された設計とされるハッシュ関数。SHA-256は実績重視、MD5は脆弱で不適、HMACは鍵付きの整合性・認証用です。"},{"id":63,"q":"攻撃者のジョンソンは、評判の高いサイバーセキュリティ企業の連絡先をオンラインで調査しました。彼はsibertech.orgの連絡先番号を見つけ、ベンダーのテクニカルサポートチームを代表していると主張してその番号に電話をかけました。彼は特定のサーバーが侵害されようとしていると警告し、sibertech.orgに提供された指示に従うように要求しました。その結果、彼は被害者に異常なコマンドを実行させ、悪意のあるファイルをインストールさせました。そして、それらを使用して重要な情報を収集し、ジョンソンのマシンに渡しました。\n\n上記のシナリオでスティーブが使用したソーシャルエンジニアリングの手法は何ですか?","c":["対価","転用窃盗","誘発","フィッシング"],"a":[0],"h":"","p":false,"cat":"攻撃・脅威・ソーシャル","g":"ソーシャルエンジニアリング","x":"利益や見返りを示して実行させる=対価(quid pro quo)です。"},{"id":64,"q":"セキュリティアナリストのマークは、組織のネットワークに差し迫った脅威を検出するために脅威ハンティングを実行する任務を負いました。彼は最初のステップでの観察に基づいて仮説を立て、DNS およびプロキシ ログから収集された既存のデータを使用して脅威ハンティングプロセスを開始しました。\n\n上記のシナリオでマークが採用した脅威ハンティング方法の種類を特定します。","c":["エンティティ主導の狩猟","TTP主導の狩猟","データ駆動型ハンティング","ハイブリッドハンティング"],"a":[2],"h":"","p":false,"cat":"攻撃・脅威・ソーシャル","g":"脅威ハンティング・インテリジェンス","x":"既存のDNS・プロキシログのデータから仮説を立てて始めるのはデータ駆動型ハンティングです。"},{"id":65,"q":"名門金融機関である NexaBank は、テキサス州ヒューストンに主要なデータセンターを構えています。このデータセンターは、機密性の高い顧客情報を保管し、毎日何百万ものトランザクションを処理するため、必要不可欠です。同銀行は、サイバーセキュリティ対策に自信を持っている一方で、ヒューストンは自然災害、特にハリケーンに弱いため、物理的な脅威については懸念を抱いています。経営陣は、自然災害によってサービスが中断したり、さらに悪いことに顧客データが危険にさらされたりする可能性があることを理解しています。同銀行は現在、こうした外部からの脅威に対応するために、物理的なセキュリティ管理を強化するオプションを検討しています。ヒューストンにある NexaBank のデータセンターでは、実装を検討する必要がある最も重要な物理セキュリティ制御はどれですか?","c":["防弾ガラスの窓と強化された壁","洪水に耐える防壁と排水システム","追加の武装警備員を配置します","顔認識機能を備えた高度な CCTV 監視"],"a":[1],"h":"","p":false,"cat":"物理セキュリティ","g":"物理セキュリティ対策","x":"ヒューストンは洪水リスクが高いため、洪水に耐える防壁と排水システムが最優先の物理対策です。"},{"id":66,"q":"ある多国籍企業のソフトウェアチームは、パンデミックの状況に役立つソリューションとして、物理的接触なしで人の酸素レベルを検出できるソフトウェアの開発を目的としたプロジェクトに携わっていました。この目的のために、チームは、2 つのデバイス間で最大 5メートルの短距離でデータをデジタル転送でき、2つのデバイス間に物理的な障害物や障害物がない場合のみ機能するワイヤレステクノロジを使用しました。\n\n上記のシナリオでソフトウェアチームが採用したテクノロジを特定してください","c":["Infrared","USB","CPS","Satcom"],"a":[0],"h":"Infrared…赤外線\nSatcom…衛星通信","p":false,"cat":"無線・モバイル・IoT","g":"近距離無線","x":"約5mの短距離で、2台の間に障害物がない場合のみ通信できるのは赤外線(Infrared)。見通しが必要なのが特徴です。"},{"id":67,"q":"ある従業員が不正行為によりセキュリティアナリストの職を解雇されました。彼は退職する際に、172.30.20.75のワークステーションにトロイの木馬サーバーをインストールしました。倫理的なハッカーとして、トロイの木馬サーバーを特定して接続し、利用可能なファイルを調べるように求められます。ワークステーションの Pictures フォルダーにある VBScriptファイルの名前を入力します。\n\nヒント: Attacker Machine-1 の「Z:\\CCT-Tools\\CCT Module01 Information SecurityThreats and Vulnerabilities\\Remote Access Ttojans(RAT)」で利用可能な Ttojan クライアント アプリケーションの 1つを使用できます。(実践的な質問)","c":["B00m3rang","リバウンドブリッツ","反動波","エコーストライク"],"a":[3],"h":"lab1-1","p":true,"cat":"実技ラボ","g":"RATクライアント","x":"Remote Access Trojansフォルダ内のTrojanクライアントアプリを使います。CSV正解は『エコーストライク』です。"},{"id":68,"q":"ある多国籍企業は、ネットワーク ディフェンダーの Brandon を雇い、会社のリモートオフィス間で安全な VPN 通信を確立しました。この目的のために、Brandonは、すべてのリモート オフィスが本社と通信するが、リモートオフィス間の通信は拒否される VPN トポロジを採用しました。上記のシナリオで Brandon が採用した VPN トポロジを特定します。","c":["ポイントツーポイントVPNトポロジ","スタートポロジー","ハブアンドスポークVPNトポロジ","フルメッシュVPNトポロジ"],"a":[2],"h":"","p":false,"cat":"ネットワーク・FW","g":"VPN・クラウド接続","x":"すべてのリモート拠点が本社とだけ通信し、拠点同士は拒否する構成=ハブアンドスポークVPN。フルメッシュは全拠点が相互接続します。"},{"id":69,"q":"組織のセキュリティ チーム メンバーである Jaseは、危険な状況下で業務が中断されないよう保証する任務を負っていました。そこで Jaseは、脅威の発生を最小限に抑え、重要なビジネス領域を保護し、脅威の影響を軽減するための抑止制御戦略を実施しました。\n\nこのシナリオで Jaseが実行したビジネス継続性と災害復旧活動は次のどれですか。","c":["予防","応答","修復","回復"],"a":[0],"h":"","p":false,"cat":"BCP・DR・バックアップ","g":"BC/DR活動","x":"脅威の発生を最小限に抑える抑止制御を実施=『予防』です。"},{"id":70,"q":"悪意のある攻撃者は、SYNフラッディング技術を使用してネットワークを混乱させ、ネットワーク上で優位に立ってファイアウォールをバイパスしました。あなたはセキュリティアーキテクトと協力して、組織のセキュリティ標準と計画を設計しています。ネットワークトラフィックは SOCチームによってキャプチャされ、詳細な分析を実行するために提供されました。★\n\nSynflood.pcapng ファイルを調べて、ソース IP アドレスを特定します。注意: Synflood.pcapng ファイルは、Attacker-1 マシンの Documents","c":["20.20.10.180","20.20.10.19","20.20.10.60","20.20.10.59"],"a":[1],"h":"lab2-3\n→tcp.flags.syn == 1 && tcp.flags.ack == 0","p":true,"cat":"実技ラボ","g":"Wireshark解析","x":"SYN Floodはtcp.flags.syn==1 && tcp.flags.ack==0で絞り込み、送信元IPを確認します。"},{"id":71,"q":"ある組織のサイバーセキュリティ専門家である Kasen氏は、事業継続および災害復旧チームと連携して作業していました。チームは組織内でさまざまな事業継続および検出活動を開始しました。このプロセスで、Kasen氏はインシデント発生時に災害現場と損傷した資材の​​両方を災害前のレベルに復元するプログラムを確立しました。\n\n上記のシナリオで、Kasen は次のどの事業継続および災害復旧活動を実行しましたか?","c":["予防","再開","レスポンス","復旧"],"a":[3],"h":"","p":false,"cat":"BCP・DR・バックアップ","g":"BC/DR活動","x":"災害現場と損傷した資材を災害前の水準に戻すプログラム=『復旧(リカバリ)』です。"},{"id":72,"q":"ビデオゲーム開発会社のネットワーク セキュリティアナリストとして、プログラマーが使用する開発サーバー上のトラフィックパターンを監視する責任があります。業務時間中、サーバーと社内のプログラマーワークステーションの間でデータパケットが絶え間なく流れていることに気付きます。このトラフィックのほとんどは、ポート 22 (SSH) とポート 5900 (VNC) の TCP 接続を利用しています。\n\nこのシナリオに基づいて、何が説明されるでしょうか?","c":["トラフィックが疑わしい暗号化された接続が存在する場合、悪意のあるアクティビティを隠そうとしている可能性が あります。","トラフィックは正常のようです。SSH と VNC は、安全なリモートアクセスとコラボレーションのためにプログラマーによってよく使用されます。","トラフィックはマルウェア感染によるものです頻繁に使用される SSH および VNCポートは、ネットワークを通じてマルウェアが拡散していることを示している可能性があります","状況は不確定ですトラフィックの性質を判断するには、さらに調査が必要です"],"a":[1],"h":"","p":false,"cat":"ネットワーク・FW","g":"プロトコル・通信","x":"SSH(22)とVNC(5900)は安全なリモートアクセスや共同作業で通常使われます。このトラフィックだけでは異常とは言えず『正常のようだ』と判断するのがCSVの正解です。"},{"id":73,"q":"ザイオンは、施設の周囲に設置された物理的なセキュリティ機器の実装と管理を担当する従業員のカテゴリに属しています。彼は、経営陣から、物理的なセキュリティに関連する機器の機能を確認するように指示されました。ザイオンの指定を特定します。","c":["監督者","最高情報セキュリティ責任者","ガード","安全担当者"],"a":[2],"h":"","p":false,"cat":"物理セキュリティ","g":"物理セキュリティ対策","x":"施設周辺の物理セキュリティ機器の実装・管理を担当する従業員のカテゴリはガードです。"},{"id":74,"q":"ケイデンはある組織の最終面接に無事合格しました。数日後、彼は会社の公式メールアドレスを通じて採用通知を受け取りました。メールには、選ばれた候補者は指定された時間内に返信しなければならないと書かれていました。ケイデンはその機会を受け入れ、採用通知に電子署名を記入し、同じメールアドレスに返信しました。会社は電子署名を検証し、彼の詳細をデータベースに追加しました。ここで、ケイデンは会社のメッセージを否定できず、会社もケイデンの署名を否定できませんでした。\n\n上記のシナリオで説明されている情報セキュリティ要素は次のどれですか?","c":["可用性","否認防止","誠実さ","機密性"],"a":[1],"h":"","p":false,"cat":"データ保護・アクセス制御","g":"CIA+否認防止","x":"署名によりメッセージの送信者も受信者も後から否認できない=否認防止。署名・タイムスタンプ・監査ログで実現します。"},{"id":75,"q":"プロのハッカーであるケビンは、サイバーテック社のネットワークに侵入しようとしています。彼は、パケットを Unicode 文字でエンコードする手法を採用しました。同社の IDSはパケットを認識できませんが、ターゲットの Webサーバーはパケットをデコードできます。\n\nケビンが IDS システムを回避するために使用した手法は何ですか?","c":["非同期化","難読化","セッションのスプライシング","緊急フラグ"],"a":[1],"h":"","p":false,"cat":"検知(IDS)・ログ・SIEM","g":"IDS回避","x":"Unicode文字などでエンコードして、IDSにはパケットが認識できずWebサーバーだけがデコードできる状態にするのは難読化(obfuscation)です。"},{"id":76,"q":"アシュトンは、SoftEight Tech でセキュリティスペシャリストとして働いています。彼は、経営陣からインターネット アクセスポリシーを強化するよう指示されました。この目的のために、システムやネットワークの使用にかかわらず、すべてを禁止し、会社のすべてのコンピューターに厳しい制限を課すタイプのインターネット アクセス ポリシーを実装しました。\n\n上記のシナリオで Ashton によって実装されたインターネット アクセスポリシーの種類を特定します。","c":["パラノイアポリシー","慎重なポリシー","許容ポリシー","プロミスキャスポリシー"],"a":[0],"h":"","p":false,"cat":"規格・法規・リスク管理","g":"インターネットアクセスポリシー","x":"インターネットアクセスを禁止し、全PCに厳しい制限を課す=パラノイアポリシーです。"},{"id":77,"q":"データの機密性を確保するために何が使えますか？（該当するものをすべて選択してください）","c":["アクセス制御リスト (ACL)","暗号化","定期的なシステムバックアップ","ソーシャルエンジニアリング"],"a":[0,1],"h":"","p":false,"cat":"データ保護・アクセス制御","g":"データ保護手法","x":"機密性を保つ手段はアクセス制御リスト(ACL)と暗号化。バックアップは可用性、ソーシャルエンジニアリングは攻撃手法です。"},{"id":78,"q":"急成長中の電子商取引会社の IT セキュリティマネージャーとして、会社の急速なオンライン展開に伴うセキュリティリスクに積極的に取り組むために、正式なリスク管理フレームワークを導入したいと考えています。\n\n単一商取引に重点を置き、拡張性が必要であることを考慮すると、どのリスク管理フレームワークが最も適切であると考えられますか。","c":["ISO 27001包括的な情報セキュリティ管理システム (ISMS) を提供します。","NIST サイバーセキュリティ フレームワーク (CSF)一般的なカスタマイズ可能なアプローチを提供します。","PCI DSS (Payment Card Industry Data Security Standard)特にクレジットカード データのセキュリティを対象としています。","COBIT (情報および関連技術の制御目標)ITガバナンスと制御プロセスに焦点を当てます。"],"a":[1],"h":"","p":false,"cat":"規格・法規・リスク管理","g":"規格・法規の選択","x":"単一商取引に重点を置き、拡張性が必要な場合は、カスタマイズ可能な一般的アプローチを持つNIST CSFが最適です。"},{"id":79,"q":"あなたは、機密性の高い金融データを扱う多国籍企業の主任サイバーセキュリティアナリストです。ネットワークセキュリティ戦略の一環として、サイバー脅威から保護するために侵入検知システム (IDS) と侵入防止システム (IPS) の両方を導入しました。ある日、IDSがネットワーク上での疑わしいアクティビティを警告し、外部からの侵入の可能性があると示しました。一方、IPSはすぐに機能し、悪意のあるトラフィックがネットワークの奥深くまで侵入する前に、それを迅速にブロックします。\n\nこのシナリオに基づくと、ネットワーク セキュリティアーキテクチャにおけるIDS と IPS の役割の主な違いは何でしょうか","c":["IDS は主にシグネチャベースの検出技術を使用し、IPS は主に異常ベースの検出方法に依存します。","IDS はネットワーク境界でのみ動作しますが、IPS は内部ネットワーク トラフィックの監視と保護も行えます。","IDSは疑わしいアクティビティを識別してアラートを生成することに重点を置いていますが、IPS は潜在的な脅威をリアルタイムで積極的にブロックして軽減します。","IDS では脅威を軽減するために手動による介入が必要ですが、IPSは人間の介入なしに脅威に自律的に対応できます"],"a":[2],"h":"","p":false,"cat":"検知(IDS)・ログ・SIEM","g":"IDSとIPS","x":"IDSは疑わしい活動を識別してアラートを出すことが中心、IPSは検知に加えて自動的にブロックまで行います。"},{"id":80,"q":"多国籍企業のセキュリティ専門家である George は、リモートロケーションで作業する従業員が制限なく任意のサイトにアクセスし、任意のアプリケーションをダウンロードし、任意のコンピューターまたはネットワークにアクセスできるようにするインターネット アクセス ポリシーを実装しました。このシナリオで Georgeが実装したインターネット アクセス ポリシーの種類を特定します","c":["許容ポリシー","パラノイアポリシー","慎重なポリシー","プロミスキャスポリシー"],"a":[0],"h":"","p":false,"cat":"規格・法規・リスク管理","g":"インターネットアクセスポリシー","x":"どこからでも何でもダウンロードでき、任意のコンピューターやネットワークにアクセスできる=許容(許可的)ポリシーです。"},{"id":81,"q":"米国を拠点とする大手ヘルスケアデータ分析会社 MediData は、AIを使用した高度な健康診断で大きな進歩を遂げています。膨大な患者データのリポジトリと、ヨーロッパでの潜在的市場を見出している MediDataは、ヨーロッパでのサービス拡大を計画しています。しかし、経営陣は慎重です。ヨーロッパの厳格なデータ保護規制では、企業はデータ処理の慣行を適応させる必要があります。MediDataの法務チームは、コンプライアンスを確保し、訴訟や罰金の可能性を最小限に抑えることを任務としています。\n\nMediDataがヨーロッパでの拡大を計画するにあたり、どの規制枠組みを最も懸念すべきでしょうか。","c":["医療保険の携行性と責任に関する法律 (HIPAA)","連邦情報セキュリティマネジメント法 (FISMA)","サーベンス・オクスリー法","欧州連合一般データ保護規則 (GDPR)"],"a":[3],"h":"","p":false,"cat":"規格・法規・リスク管理","g":"規格・法規の選択","x":"ヨーロッパへ拡大する際に最も懸念すべきなのはEU一般データ保護規則(GDPR)です。"},{"id":82,"q":"ボブは最近、大規模なサイバーセキュリティ侵害を経験した医療会社に雇われました。多くの患者が、個人の医療記録がインターネット上で完全に公開されており、誰でも Google検索で簡単に見つけられると不満を言っています。ボブの上司は、それらのデータを保護する規制について非常に心配しています。\n\n次の規制のうち、最も違反されているのはどれですか。","c":["HIPPA/PHl","プル","PCIDSS","ISO 2002"],"a":[0],"h":"","p":false,"cat":"規格・法規・リスク管理","g":"規格・法規の選択","x":"患者の医療情報(PHI)がネットで公開された場合はHIPAA/PHI違反です。"},{"id":83,"q":"ある組織の従業員である Thomas は、オフィス システムから特定の Webサイトへのアクセスを制限されています。彼は、制限を解除するために管理者の資格情報を取得しようとしています。機会を待っている間に、彼は管理者とアプリケーションサーバー間の通信をスニッフィングして、管理者の資格情報を取得しました。\n\n上記のシナリオで Thomas が実行した攻撃の種類を特定します。","c":["ヴィッシング","盗聴","フィッシング","ゴミ漁り"],"a":[1],"h":"","p":false,"cat":"攻撃・脅威・ソーシャル","g":"ソーシャルエンジニアリング","x":"管理者とアプリサーバー間の通信をスニッフィングして資格情報を取得=盗聴です。"},{"id":84,"q":"レオは食料品を買うために最寄りのスーパーマーケットまで歩いて行きました。請求部門では、請求担当者が各商品の機械読み取り可能なタグを読み取り可能な機械にスキャンしました。\n\n機械は商品の詳細を自動的に読み取り、個々の商品の価格をコンピューターに表示し、スキャンした商品の合計を計算します。すべての商品のスキャンが完了したら、レオは代金を支払わなければなりません。\n\n上記のシナリオで請求担当者が使用した短距離無線通信技術の種類を特定します。","c":["無線周波数識別 (RFID)","近距離無線通信 (NFC)","クイック","QR コードとバーコード"],"a":[0],"h":"","p":false,"cat":"無線・モバイル・IoT","g":"近距離無線","x":"商品のタグを読み取って価格・合計を表示するレジの仕組みはRFID(無線周波数識別)です。"},{"id":85,"q":"災害復旧計画と事業継続計画の主な違いは何ですか?","c":["災害復旧計画はデータのバックアップに重点を置き、事業継続計画は人員の安全に重点を置 きます。","災害復旧計画は技術的な復旧に関係しますが、事業継続計画は事業運営のあらゆる側面をカ バーします。","災害復旧計画は自然災害にのみ適用されますが、事業継続計画は人為的な事象も対象としま す。","災害復旧計画は、事業継続計画よりも短くてシンプルです。"],"a":[1],"h":"","p":false,"cat":"BCP・DR・バックアップ","g":"BCPとDRP","x":"DRPはITシステムなどの技術的復旧が中心、BCPは事業運営のあらゆる側面をカバーします。"},{"id":86,"q":"インシデント対応プロセスのどの段階で封じ込めと根絶の活動が実行されますか?","c":["準備","回復","封じ込め","検出と分析"],"a":[2],"h":"","p":false,"cat":"インシデント対応","g":"IH&Rの段階","x":"封じ込めと根絶の活動は『封じ込め』フェーズで行われます(CSVの正解)。"},{"id":87,"q":"法医学者のアラベラは、標準的な法医学調査報告書テンプレートを使用して、事件に関連するすべての証拠を記録しました。彼女は、犯罪の詳細すべてと捜査プロセスの日々の進行状況を網羅した報告書のさまざまなセクションに記入しました。アラベラは、法医学調査報告書のどのセクションに「申し立ての内容と警官に提供された情報」を記録しましたか?","c":["調査プロセス","調査目的","証拠情報","評価と分析のプロセス"],"a":[1],"h":"","p":false,"cat":"フォレンジック","g":"捜査チーム・報告書","x":"報告書の『調査目的』のセクションに、申し立ての内容と警察に提供された情報を記録します。"},{"id":88,"q":"認定セキュリティ専門家のアレックスは、攻撃側チームと防御側チームの両方で働いています。彼のチームの主な責任は、保護を強化し、組織のセキュリティ基準を高めることです。このシナリオでアレックスのチームを特定します。","c":["白チーム","紫チーム","青チーム","赤チーム"],"a":[1],"h":"","p":false,"cat":"攻撃・脅威・ソーシャル","g":"テスト種別・チーム","x":"攻撃側と防御側の両方で保護を強化し組織の基準を高めるのは紫チームです。"},{"id":89,"q":"プロの侵入テスト担当者である Tristan は、ある組織に採用され、その組織のネットワークインフラストラクチャをテストしました。その組織は、現在のセキュリティ体制と外部の脅威に対する防御力を把握したいと考えていました。この目的のため、組織は Tristan に ITインフラストラクチャに関する情報を一切提供しませんでした。そのため、Tristanは組織からの情報や支援を受けずにゼロ知識攻撃を開始しました。\n\n上記のシナリオで、Tristan が開始した侵入テストの種類は次のどれですか?","c":["ブラックボックステスト","ホワイトボックステスト","グレーボックステスト","半透明ボックスのテスト"],"a":[0],"h":"","p":false,"cat":"攻撃・脅威・ソーシャル","g":"テスト種別・チーム","x":"組織から一切の情報を提供されず行う侵入テスト=ブラックボックステスト(ゼロ知識)です。"},{"id":90,"q":"Web アプリケーション www.movi​​eabc.com は、SQLインジェクション攻撃を受けやすいことが判明しました。Webアプリケーションを悪用してユーザーの資格情報を取得するタスクが与えられます。データベース テーブルでユーザー john にマップされている UID を選択します。\n\n注記：Username: sam Pass: test","c":["5","3","2","4"],"a":[2],"h":"lab2-4\n問題集では「4」が回答となっていた\n\n●回答方法\nAttacker Machine1で「Firefox」起動し、「http://www.movi​​escope.com/」を入力。\n問題分のログイン情報入力。\n「View Profile」アイコンをクリック。\nsam Profileが確認できる。\nここでURLを確認すると、「～viewprofile.aspx/id=1」と確認できる。\n「～viewprofile.aspx/id=1」のID部分を選択肢の数字変更し、「john」を見つける。\n※labだと、下記であることが確認できる。\nid=1　sam\nid=2　 john\nid=3　kety\nid=4　steve\nid=5　lee","p":true,"cat":"実技ラボ","g":"SQLi・プロファイルID","x":"Q14と同じラボ。URLのid=を変えてjohnのUIDを確認します。ラボ上は id=2 が John(問題集は『4』と記載)。"},{"id":91,"q":"ある組織のセキュリティ専門家である Rhettは、進化する脅威から身を守るために、企業ネットワークに IDSソリューションを導入するよう指示されました。この目的のために、Rhettは、まず侵入の可能性のあるモデルを作成し、次にそのモデルを受信したイベントと比較して検出の決定を下す IDS ソリューションを選択しました。\n\n上記のシナリオで IDS ソリューションが採用している検出方法を特定します。","c":["未使用検出","プロトコル異常検出","異常検出","署名認識"],"a":[2],"h":"","p":false,"cat":"検知(IDS)・ログ・SIEM","g":"検知方式","x":"侵入の可能性のあるモデルを作成して受信イベントと比較する方式は異常検出です。"},{"id":92,"q":"量子コンピューティングを専門とする大手テクノロジー企業である FusionTechは、サンフランシスコのダウンタウンに本社を置き、マルチテナントの高層ビルに所在しています。オフィスは 3 フロアにまたがっています。FusionTechが保有する最先端のテクノロジーと独自のデータは、サイバー脅威と物理的脅威の両方の主要なターゲットとなっています。\n\n最近、社内セキュリティレビュー中に、権限のない人物がフロアの 1つにいたことが発覚しました。侵入はありませんでしたが、警告が出されました。経営陣は、2,000人以上の従業員とビルの他のテナントにあまり迷惑をかけずに、この脆弱性に対処したいと考えています。\n\nFusionTechの特有の課題を考慮すると、職場のセキュリティを強化するために主に検討すべき対策は何でしょうか?","c":["各階の入口に網膜スキャンを導入します。","時間ベースのアクセス制御を備えた従業員バッジ システムを導入します","各階に警備員を配置します","FusionTech 従業員用に別の入口とエレベーターを設置します。"],"a":[1],"h":"","p":false,"cat":"物理セキュリティ","g":"物理セキュリティ対策","x":"多数のテナントがいるビルでは、時間ベースのアクセス制御付き従業員バッジが影響を抑えつつ有効です。"},{"id":93,"q":"セキュリティ専門家のカーター氏は、ネットワークに侵入しようとする攻撃者を誘い込むために、組織のネットワークにハニーポットを設置しました。この目的のために、彼は実際のOS やターゲットネットワークのアプリケーションやサービスをシミュレートするタイプのハニーポットを構成しました。さらに、カーター氏が設置したハニーポットは、事前に設定されたコマンドにのみ応答します。\n\n上記のシナリオで Karter によって展開されたハニーポットのタイプを特定します。","c":["低インタラクションハニーポット","純粋なハニーポット","中程度のインタラクションのハニーポット","高インタラクションハニーポット"],"a":[0],"h":"","p":false,"cat":"検知(IDS)・ログ・SIEM","g":"ハニーポット","x":"事前設定されたコマンドにのみ応答する擬似サービスを提供するのは低インタラクションハニーポットです。"},{"id":94,"q":"セキュリティ専門家の Elliott は、Bastionホストを使用して組織のネットワークに展開された新しく開発されたアプリケーションのテストを任されました。Elliott は、再利用できない Bastionホストを構成することでプロセスを開始しました。次に、新しく開発されたアプリケーションをテストして、まだ知られていないセキュリティ上の欠陥の存在を特定し、さらに、安全でないサービスを実行しました。上記のシナリオで Elliott が構成した Bastionホストの種類を特定します。","c":["外部サービスホスト","犠牲マシン","ワンボックスファイアウォール","ルーティングなしのデュアルホームホスト"],"a":[1],"h":"","p":false,"cat":"ネットワーク・FW","g":"FW運用・構成","x":"未知の欠陥の検出のためにわざと安全でないサービスを動かし、侵害されることを前提とするバスチオンホストは『犠牲マシン(sacrificial host)』です。"},{"id":95,"q":"あなたは、航空宇宙および防衛分野における先進的な技術ソリューションで有名な多国籍テクノロジー複合企業 GlobalTech の主任サイバーセキュリティスペシャリストです。\n\nこの組織の評判は、同社が開拓する革新的なテクノロジーによって築かれており、その多くは国家の最高機密です。日曜の深夜、画期的なミサイル防衛システムの設計図とプロジェクトの詳細が保存されているサーバーで不審な活動が行われているという警告を受け取りました。兆候は、従来のセキュリティ対策を回避した複雑で多段階のサイバー攻撃を示唆しています。予備調査により、サイバー犯罪者が内部者の認証情報を使用した可能性があり、侵入がさらに複雑になっていることが判明しました。関係するデータの機密性が非常に高いため、漏洩は国家安全保障に深刻な影響を及ぼし、会社の評判を回復不能なほど傷つける可能性があります。\n\nこのセキュリティインシデントの潜在的な重大性と複雑さを考慮して、この状況を効果的に処理し、重要なデータを保護し、潜在的な影響を最小限に抑えるために、どのような即時の措置を講じるべきでしょうか","c":["最高経営責任者と法務チームに違反について報告します。株主と顧客に事件と講じられている対策について常に最新情報が伝わるように、公開声明を準備します。","インシデント対応プロトコルを開始し、影響を受けたサーバーを隔離して即時封じ込めることに重点を置きます。同時に、ネットワークログと影響を受けたシステムを調べて、侵害の範囲と深刻度を評価します。","国家安全保障の潜在的な侵害について連邦政府機関に通知します。連邦政府機関と連携して、さらなるデータ流出を防ぎ、国家の利益を保護するために必要なすべての措置が講じられるようにします。","外部の専門サイバーセキュリティ会社と連携して並行調査を実施し、その専門知識を活用して犯人を特定し、侵害の手口を理解します。"],"a":[1],"h":"","p":false,"cat":"インシデント対応","g":"初動対応","x":"まずインシデント対応プロトコルを開始し、影響サーバーを隔離して即時に封じ込めます。"},{"id":96,"q":"ジェーンはビッグテック社の最高財務責任者に新しく任命されました。1週間以内に、会社の CEOを装った送信者から、緊急の電信送金を行うよう指示する疑わしいメールを受け取ります。ジェーンは、要求の信憑性を確認することにしました。彼女は同じ送信者から別のメールを受け取り、今度は CEOの手書きのメモをスキャンしたと思われる画像が添付されていました。同時に、彼女は「ITサポート」担当者から電話を受け、添付画像をクリックして「セキュリティパッチ」をダウンロードするように指示されました。ジェーンは、自分が遭遇したソーシャル エンジニアリングの戦術を特定する必要があります。","c":["手書きのメモ画​ ​像による誘引と、「IT サポート」コールによる事前ロード。","電子メールと「IT サポート」コールによる質問の両方を通じてスピアフィッシングを実行します。","CEO になりすました電子メールによるフィッシングと、「IT サポート」電話による誘い込み。","CEO になりすました電子メールによるスピアフィッシングと、「IT サポート」電話によるフィッシング。"],"a":[3],"h":"","p":false,"cat":"攻撃・脅威・ソーシャル","g":"ソーシャルエンジニアリング","x":"CEOになりすましたメールによるスピアフィッシングと、ITサポートを装った電話による攻撃の組み合わせが正解の選択肢です。"},{"id":97,"q":"ある組織のネットワーク セキュリティ管理者である Matiasは、自社のネットワークに安全なワイヤレスネットワーク暗号化を実装する任務を負っていました。\n\nこの目的のために、Matias は 256ビットの Galois/Counter Mode Protocol (GCMP-256)を使用してデータの信頼性と機密性を維持するセキュリティソリューションを採用しました。\n\n上記のシナリオで Matias が採用しているセキュリティソリューションで使用されるワイヤレス暗号化の種類を特定します。","c":["WPA2 暗号化","WPA3 暗号化","WEP暗号化","WPA暗号化"],"a":[1],"h":"","p":false,"cat":"無線・モバイル・IoT","g":"無線暗号・認証","x":"楕円曲線(P-256)を使い、データの信頼性と機密性を守る最新方式はWPA3です。"},{"id":98,"q":"世界的な金融機関である PolarFinは、新しい取引システムへの移行を進めています。金融データの機密性と準拠する国際規制を考慮すると、PolarFinには、強力なセキュリティを提供し、国際的に広く受け入れられる暗号化アルゴリズムが必要です。アルゴリズムは、暗号化と復号化の両方の機能をサポートする必要があります。\n\nPolarFinは、この移行においてどの暗号化アルゴリズムを第一の選択肢として検討すべきでしょうか。","c":["HMAC (ハッシュベースのメッセージ認証コード)","RSA (リベスト・シャミール・アデルマン)","DES (データ暗号化標準)","Blowfish(共通鍵暗号方式)"],"a":[1],"h":"","p":false,"cat":"暗号・署名","g":"暗号方式の使い分け","x":"暗号化と復号の両方ができ、広く受け入れられている公開鍵暗号はRSA。HMACは認証コードで復号できず、DESは弱く、Blowfishは共通鍵です。"},{"id":99,"q":"セキュリティエンジニアのアンダーソンは、組織のネットワーク上のすべての受信トラフィックと送信トラフィックを監視して、疑わしいトラフィックを特定するよう指示されました。この目的のために、彼は分析手法を使用して、IP オプション、IP プロトコル、IPフラグメンテーション フラグ、オフセット、識別などのパケット ヘッダーフィールドを分析し、転送中にフィールドが変更されていないかどうかを確認しました。\n\n上記のシナリオでアンダーソンが実行した攻撃シグネチャ分析の種類を特定します。","c":["コンテキストベースのシグネチャ分析","アトミック署名ベースの分析","複合署名ベースの分析","コンテンツベースの署名分析"],"a":[0],"h":"","p":false,"cat":"検知(IDS)・ログ・SIEM","g":"シグネチャ分析","x":"パケットヘッダのフィールド(フラグ、オフセット、識別子など)を分析し、通信中に変化がないか見るのはコンテキストベースのシグネチャ分析(CSVの正解)です。"},{"id":100,"q":"あなたは国際金融機関のサイバーセキュリティ責任者です。あなたの組織は世界中の何百万もの顧客にオンライン バンキングサービスを提供しており、最近、スケーラビリティとコスト効率を高めるためにコアバンキング システムをハイブリッド クラウド環境に移行しました。ある晩、定期的なシステム パッチの適用後、Web アプリケーション ファイアウォール(WAF) からサーバー側リクエスト フォージェリ (SSRF)アラートが急増しました。同時に、侵入検知システム (IDS)は、アプリケーション層からクラウド メタデータサービスとやり取りしようとする試みの可能性を警告します。この試みにより、機密性の高いクラウド構成の詳細や API キーが漏洩する可能性があります。これは、攻撃者が SSRFの脆弱性を利用してクラウドインフラストラクチャに侵入しようとしていることを明確に示しています。\n\nサービスの重要性とそれに伴うリスクの高さを考慮すると、銀行の顧客への影響を最小限に抑えながら、この差し迫った脅威に対処するにはどうすればよいでしょうか。","c":["クラウド セキュリティを専門とするサードパーティのサイバーセキュリティ企業と連携して緊急監査を実施し、その専門知識を活用して根本原因と潜在的な侵害を特定します。","最新のパッチを直ちにロールバックし、潜在的な不正アクセスについてクラウドサービス プロバイダーに通知して、脆弱性の範囲を評価し、共同対応を調整します。","影響を受けるクラウド サーバーを分離し、トラフィックをバックアップサーバーにリダイレクトして、クラウド ネイティブ セキュリティツールを使用して疑わしいアクティビティの詳細な分析を開始しながら、継続的なサービスを確保します","すべての銀行顧客に潜在的なセキュリティインシデントについて通知し、パスワードの変更とアカウントの不正なアクティビティの監視を促します。"],"a":[2],"h":"","p":false,"cat":"インシデント対応","g":"初動対応","x":"影響サーバーを分離しトラフィックをバックアップに切り替えて、顧客への影響を最小化しつつ脅威を封じ込めます。"},{"id":101,"q":"Galactic Innovations は、新興の技術系スタートアップ企業です。クラウドプラットフォームでホストされる独自のソフトウェアソリューションを開発しています。リアルタイムのコミュニケーションとコラボレーション用に設計されたこのソフトウェアは、一流企業を含む世界中のユーザーに対応することを目的としています。ソフトウェアが複雑になるにつれ、同社はグローバルなベストプラクティスに合致する包括的なセキュリティ標準の必要性を認識しています。その目的は、潜在的なクライアントの間で信頼性を高め、特にサイバー脅威が増大する中で、アプリケーションが業界で受け入れられている基準を満たすようにすることです。\n\n同社の要件とユーザー ベースの国際性を考慮すると、Galactic Innovations はどのソフトウェアセキュリティ標準、モデル、またはフレームワークの採用に主に焦点を当てるべきでしょうか。","c":["宇宙科学研究所","QlSO/IEC 27001:2013","GCSP","USAM"],"a":[1],"h":"","p":false,"cat":"規格・法規・リスク管理","g":"規格・法規の選択","x":"グローバルなソフトウェアセキュリティ標準としてはISO/IEC 27001の採用に注力します。"},{"id":102,"q":"ある組織の新入社員であるメイジーは、組織の敷地の 1 階と 3階にのみアクセスできるアクセス バッジを受け取りました。メイジー ハイドは、2階の入り口にあるバッジ リーダーにアクセスバッジをスキャンしましたが、失敗しました。このシナリオで組織が使用する短距離無線通信テクノロジを特定してください。","c":["RFID","Li-Fi","ブルートゥース","Wi-Fi"],"a":[0],"h":"","p":false,"cat":"無線・モバイル・IoT","g":"近距離無線","x":"バッジをスキャンして階ごとのアクセス可否を判定する近距離無線技術はRFIDです。"},{"id":103,"q":"ヘンリーは、BlackEye - Cyber​​ security solutions に雇われたサイバーセキュリティの専門家です。彼は、ホストのオペレーティング システム (OS)を検出する任務を負っていました。彼は、Unkornscan ツールを使用して、ターゲットシステムの OS を検出しました。その結果、彼は、ターゲット システムで Windows OSが実行されていることを示す TTL 値を取得しました。\n\nヘンリーが取得した、ターゲット OSが Windows であることを示す TTL 値を特定します。","c":["64","128","255","138"],"a":[1],"h":"","p":false,"cat":"ネットワーク・FW","g":"ICMP・TTL・コマンド","x":"WindowsのTTL初期値は128、Linux/Unixは64、ネットワーク機器(Cisco等)は255が目安です。"},{"id":104,"q":"あなたは侵入テスターとして、クライアント xyzの従業員のユーザー意識をテストしています。公開されている情報源から 2人の従業員の電子メールを収集し、クライアント側のバックドアを作成して、電子メールで従業員に送信しています。\n\nサイバー キル チェーンのどの段階にいますか?","c":["偵察","指揮統制","武器化","搾取"],"a":[2],"h":"","p":false,"cat":"攻撃・脅威・ソーシャル","g":"キルチェーン・フレームワーク","x":"クライアント側バックドアを作成してメールで送る前段階=武器化(Weaponization)です。"},{"id":105,"q":"セキュリティ専門家の Cassiusは、組織内のリスク管理チームに勤務しています。このチームは、リスク管理プロセスに関わるさまざまな活動を実行する責任を負っています。このプロセスで、Cassiusは、特定されたリスクの重大度レベルに基づいてリスクに対処するために、適切な制御を選択して実装するように指示されました。\n\n上記のシナリオで Cassiusが実行するように指示されたリスク管理フェーズは次のどれですか?","c":["リスク分析","リスク対応","リスクの優先順位付け","リスクの特定"],"a":[1],"h":"","p":false,"cat":"規格・法規・リスク管理","g":"リスク管理","x":"特定されたリスクの重大度に基づいて制御を選択・実装する=リスク対応フェーズです。"},{"id":106,"q":"ネットワーク エンジニアの Steve は、予期しないパケットドロップの原因となっているネットワークの問題のトラブルシューティングを任されました。この目的のために、彼はネットワーク トラブルシューティングユーティリティを使用して、サーバーに送信された ICMPエコー要求パケットをキャプチャしました。彼は、ネットワーク接続の不良が原因で、ゲートウェイで特定のパケットがドロップされていることを確認しました。\n\n上記のシナリオで Steve が使用したネットワーク トラブルシューティングユーティリティを特定します。","c":["dnsenurn","arp","traceroute","ipconfig"],"a":[2],"h":"","p":false,"cat":"ネットワーク・FW","g":"ICMP・TTL・コマンド","x":"ゲートウェイでパケットが落ちている箇所を経路ごとに調べるのはtraceroute。arpはアドレス解決、ipconfigはIP設定、dnsenumはDNS列挙です。"},{"id":107,"q":"脅威インテリジェンス フィード データ ファイルが取得され、Attacker Machine-1 のDocuments フォルダーに保存されました (ファイル名: Threatfeed.txt)。あなたは ABC組織に勤務するサイバーセキュリティ技術者です。組織から、データを分析し、脅威の状況に関するレポートを提出するタスクが割り当てられました。http://securityabc.s21sec.com にリンクされている IPアドレスを選択します。","c":["5.9.200.200","5.9.200.150","5.9.110.120","5.9.188.148"],"a":[3],"h":"lab6-2\n●回答方法\nAttacker Machineのデスクトップの「attacker‘s Home」をクリック。\nDocuments フォルダーに保存された、ファイル名: Threatfeed.txtを右クリック\nNotepad++ で編集で開く。\nhttp://securityabc.s21sec.comに対応するアドレスを探す。","p":true,"cat":"実技ラボ","g":"その他ラボ","x":"Documentsフォルダ内のThreatfeed.txtをNotepad++で開き、対象ドメインに対応するIPを探します。"},{"id":108,"q":"ネットワーク内で5SHサービスが有効になっているマシンを特定します。そのマシンへのSSH接続を開始し、マシン内のファイルttag.txtを探し、その内容を回答として入力します。★SSHログインの認証情報はsam/admin@123です","c":["sam@bob","bob2@sam","sam2@bob","bob1@sam"],"a":[3],"h":"lab15-4\nlab14-4\n●回答方法\nAttacker Machineでターミナルを開き、下記コマンドで、SSHサービスが有効なマシンを見つける\n「nmap -p 22 10.10.1.0/24」\nポート 22/tcp open ssh となっているターゲット IP アドレスを特定。\n※下記のように空きがわかる。\nPORT STATE SERVICE\n 22/tcp open ssh\n「ssh sam@xx.xx.xx.xx」→PW:admin@123でログイン。\n「find / -name flag.txt」or「ls -la /」→「cat flag.txt」で画面出力されたものが答え。","p":true,"cat":"実技ラボ","g":"SSHでflag取得","x":"Q17と同じラボ。SSHでログインしflag.txtの中身を読みます(CSV正解を暗記)。"},{"id":109,"q":"Web アプリケーション www.luxurytreats.com の脆弱性分析を実行し、WASC ID 9のアラートの名前を特定します。(実践問題)","c":["CSRF対策トークンの不在","アプリケーションエラーの開示","MAC 署名なしのビューステート","X-Frame-Options ヘッダーが設定されていません"],"a":[0],"h":"lab7-4\n問題集では「アプリケーションエラーの開示」が回答となっていた\n●回答方法\nOWASP ZAPを起動。※既にスキャン済なのか？\n「Alerts」タブを開く。\n「www.luxurytreats.com」に関するアラートを展開。\n右側の詳細欄で「WASC ID 9」を探す。\n※WASC ID 9 は 「Information Leakage（情報漏洩）」で、\n　OWASP ZAPなどのレポートでは 「Application Error Disclosure（アプリケーションエラーの開示）」と表示される。\n→確認自体不要か。。。","p":true,"cat":"実技ラボ","g":"その他ラボ","x":"OWASP ZAPのアラートでWASC ID 9を確認します。CSVの正解は『CSRF対策トークンの不在』(WASC ID 9はCSRF。問題集は『アプリケーションエラーの開示』と記載)。"},{"id":110,"q":"あなたは、Beta Inc. というトップ企業でセキュリティコンサルタントとして働いています。セキュリティ コンサルタントであるあなたは、Beta Inc.のサーバー上の重要なデータを暗号化するランサムウェア攻撃を受けた後、会社の状況を評価するよう求められています。\n\n攻撃を特定した後、すぐに実行する必要がある最も重要なアクションは何ですか?","c":["感染したデバイスを特定して隔離し、さらなる拡散を防ぎます。","BCP に従ってバックアップから重要なシステムを復元します。","攻撃ベクトルを分析して感染源を特定します。","暗号化されたデータへのアクセスを回復するには、身代金を支払います。"],"a":[0],"h":"","p":false,"cat":"インシデント対応","g":"初動対応","x":"ランサムウェア攻撃後の最優先は、感染デバイスを特定・隔離して拡散を防ぐことです。身代金の支払いは推奨されません。"},{"id":111,"q":"金融サービス ソフトウェア プロバイダーの FinTech Corpは、毎日何百万ものトランザクションを処理しています。他の組織で最近発生した侵害に対処するため、同社はデータセキュリティ制御を再評価しています。具体的には、脅威に対するリアルタイムの保護を提供するだけでなく、世界的な金融規制への準拠を達成するのに役立つ制御が必要です。同社の主な目標は、システムのパフォーマンスを妨げずに機密トランザクションデータを保護することです。\n\n次の制御のうち、FinTech Corpの目的に最も適しているのはどれでしょうか。","c":["すべてのトランザクションデータベースをディスクレベルの暗号化に切り替える","DLP (データ損失防止) システムの実装","異常ベースの侵入検知システムの導入","すべてのデータベースアクセスに2要素認証を適用する"],"a":[1],"h":"","p":false,"cat":"データ保護・アクセス制御","g":"データ保護手法","x":"性能を落とさず機密トランザクションデータの流出を防ぐにはDLP。ディスク暗号化は性能への影響、2FAや異常検知IDSは目的(データ保護)と直接合いません。"},{"id":112,"q":"ある組織のセキュリティ専門家であるスティーブンは、従業員のモバイルデバイスでの企業データの漏洩を防ぐセキュリティ対策を実施するよう指示されました。この目的のために、彼はすべての個人データと企業データを従業員のモバイルデバイス上で分離する手法を採用しました。この手法を使用すると、企業アプリケーションは従業員の個人アプリケーションやデータを制御したり通信したりできなくなります。\n\n上記のシナリオでスティーブンが実装したテクニックは次のうちどれですか?","c":["完全なデバイス暗号化","ジオフェンシング","コンテナ化","OTAアップデート"],"a":[2],"h":"","p":false,"cat":"無線・モバイル・IoT","g":"モバイル管理","x":"企業アプリと個人アプリ・データを分離して互いに制御・通信できなくする手法はコンテナ化です。"},{"id":113,"q":"大手テクノロジー企業 ProNet は、従業員の増加とビジネスニーズの変化に対応するため、社内インフラストラクチャをダイナミックに進化させてきました。同社の現在のプロジェクトは、社内プラットフォームの全体的なセキュリティを強化することです。同社のセキュリティチームは、堅牢なアクセス制御システムに重点を置いています。システムを効率的にするには、組織内の役割に基づいてアクセスを定義するモデルを実装する必要があります。特定の役割には特定のリソースへの事前定義されたアクセスがあり、その役割は複数のユーザーに割り当てることができます。目的は、権限の割り当てに伴う管理作業を減らし、ユーザーが職務に応じて必要な権限のみを取得できるようにすることです。\n\nProNet の要件に最適なアクセス制御モデルはどれですか?","c":["属性ベースのアクセス制御 (ABAC)","任意アクセス制御 (DAC)","ロールベースのアクセス制御 (RBAC)","強制アクセス制御 (MAC)"],"a":[2],"h":"","p":false,"cat":"データ保護・アクセス制御","g":"アクセス制御モデル","x":"役割(ロール)に権限を割り当て、ユーザーにロールを付与することで管理作業を減らす=RBAC。職務に必要な権限だけを与えられます。"},{"id":114,"q":"大手金融機関のサイバーセキュリティ担当ディレクターとして、さまざまなデジタル業務のセキュリティ プロトコルを監督します。この金融機関は最近、人工知能 (AI)ベースの不正検出システムを統合した新しいコア バンキングプラットフォームに移行しました。このシステムは、パターン認識と行動分析を活用して、リアルタイムの取引を監視します。移行から 1 週間後、AIシステムの異常な動作パターンが警告されます。詳しく調べてみると、システムが本物の取引を誤って不正とフラグ付けし、誤検知が急増していることがわかりました。これは顧客の銀行業務を混乱させるだけでなく、手動レビューチームにも負担をかけます。予備調査では、AI のトレーニングデータを侵害して意思決定能力を歪めようとする、微妙なデータポイズニング攻撃が示唆されています。\n\nAIベースの不正検出システムを保護し、財務データの整合性を維持するために、次のどの手順に重点を置く必要がありますか。","c":["AI 開発チームと協力して、検証済みのトランザクションデータのみを使用してモデルを再トレーニングし、データポイズニングの試みを検出するためのリアルタイム監視を実装します。","新しいシステムが徹底的に検査され、潜在的な脆弱性がすべて解決されるまで、従来の銀行プラットフォームに移行します。","サードパーティのサイバーセキュリティ企業と連携して、潜在的なデータ侵害ポイントに焦点を当て、コアバンキングプラットフォーム全体に対して徹底的な侵入テストを実施します","広範な顧客アウトリーチプログラムを実施し、顧客に取引記録の不一致を報告するよう促し、フラグが付けられた取引を手動で検証します。"],"a":[0],"h":"","p":false,"cat":"攻撃・脅威・ソーシャル","g":"AI・サプライチェーン","x":"データポイズニングへの対策は、検証済みのトランザクションデータだけでモデルを再学習させることです。"},{"id":115,"q":"セキュリティ専門家のナンシーは、Linuxマシンの予期しないシャットダウンと再起動に関連する問題を特定するよう指示されました。インシデントの原因を特定するために、ナンシーは Linuxシステム上のディレクトリに移動し、ログファイルにアクセスして、不適切なシャットダウンと計画外の再起動に関連する問題のトラブルシューティングを行いました。\n\n上記のシナリオで Nancy がアクセスした Linux ログ ファイルを特定します。","c":["/var/log/secure","/var/log/kern.log","/var/log/boot.log","/var/log/lighttpd/"],"a":[2],"h":"","p":false,"cat":"フォレンジック","g":"Linuxログ","x":"不適切なシャットダウンや計画外の再起動など起動関連の調査は/var/log/boot.logです。"},{"id":116,"q":"ある組織の IH&R チームは、組織のネットワークに接続されたホストの 1つに対する最近のマルウェア攻撃に対処していました。IH&R チームのメンバーであるEdwin は、バックアップメディアから失われたデータを復元する作業に携わっていました。この手順を実行する前に、Edwin はバックアップにマルウェアの痕跡がないことを確認しました。\n\n上記のシナリオで Edwin が実行した IH&R ステップを特定します。","c":["根絶","インシデントの封じ込め","通知","回復"],"a":[3],"h":"","p":false,"cat":"インシデント対応","g":"IH&Rの段階","x":"バックアップにマルウェアがないことを確認してデータを復元=『回復』です。"},{"id":117,"q":"NetSafe Corpは最近、ネットワーク全体のオーバーホールを実施しました。この更新により、古いベースライン トラフィック シグネチャは適用されなくなります。セキュリティチームは、通常のアクティビティと疑わしいアクティビティの両方を包括的に捕捉する新しいベースラインを確立する必要があります。目標は、過度の誤検知を発生させることなく、脅威をリアルタイムで検出して軽減することです。\n\nNetSafe Corpは、このベースラインを効果的に設定するために、どのようなアプローチを採用すべきでしょうか。","c":["1 週間にわたって継続的にデータを収集し、平均トラフィック パターンをベースラインとして定義します。","機械学習アルゴリズムを利用して 1 か月間のトラフィックを分析し、動的なベースラインを生成します。","昨年のトラフィック ログを分析し、履歴データを使用してベースラインを予測します","レッドチームの演習を実施し、特定された脅威に基づいて新しいベースラインを作成します"],"a":[1],"h":"","p":false,"cat":"検知(IDS)・ログ・SIEM","g":"検知方式","x":"誤検知を抑えつつリアルタイム検出するには、機械学習で一定期間(1か月)のトラフィックを分析して動的ベースラインを作るのが最適です。"},{"id":118,"q":"ある組織のセキュリティ専門家であるリックソン氏は、10cm以内の範囲内でデバイス間の近距離通信を確立するように指示されました。この目的のために、彼は電磁誘導を利用してデバイス間の通信を可能にするモバイル接続方法を使用しました。リックソン氏が選択したモバイル接続方法は、RFIDタグを読み取り、近くのデバイスと Bluetooth接続を確立して画像や連絡先リストなどの情報を交換することもできます。\n\n上記のシナリオで、リックソンが使用したモバイル接続方法はどれですか?","c":["NFC","衛星通信","携帯電話通信","ANT"],"a":[0],"h":"","p":false,"cat":"無線・モバイル・IoT","g":"近距離無線","x":"RFIDタグの読み取りと、近くのデバイスとのBluetooth接続確立ができるモバイル接続方法はNFCです。"},{"id":119,"q":"ある組織のネットワーク管理者である Jaden は、pingコマンドを使用して、組織のネットワークに接続されたシステムの状態を確認しました。彼は、IP ヘッダー フィールドに無効な情報が含まれていることを示すICMP エラーメッセージを受け取りました。Jaden は ICMP パケットを調べたところ、IPパラメータの問題であることがわかりました。\n\n上記のシナリオで Jaden が受信した ICMP エラー メッセージのタイプを特定します。","c":["タイプ =12","タイプ = 8","タイプ = 5","タイプ = 3"],"a":[0],"h":"","p":false,"cat":"ネットワーク・FW","g":"ICMP・TTL・コマンド","x":"IPパラメータの問題を示すICMPはType 12(パラメータ問題)。Type 3=到達不能、Type 5=リダイレクト、Type 8=エコー要求です。"},{"id":120,"q":"組織のセキュリティ専門家であるチャーリーは、WLANへの不正アクセスと盗聴に気付きました。このような試みを阻止するために、チャーリーはRC4 アルゴリズムを使用してデータリンク層の情報を暗号化する暗号化メカニズムを採用しました。\n\n上記のシナリオでチャーリーが採用したワイヤレス暗号化の種類を特定してください。","c":["TKIP","WEP","AES","CCMP"],"a":[1],"h":"","p":false,"cat":"無線・モバイル・IoT","g":"無線暗号・認証","x":"RC4アルゴリズムでデータリンク層の情報を暗号化する方式はWEPです(WPAのTKIPもRC4ですが、WEPが典型)。"},{"id":121,"q":"セキュリティ専門家のヘイズ氏は、パーデュー レベル 3.5 (IDMZ)の産業ネットワークのセキュリティ制御の実装を任されました。ヘイズ氏は、IDMZレベルで考えられるすべての攻撃ベクトルを検証し、サイバー攻撃に対して IDMZを強化するセキュリティ制御を導入しました。\n\n上記のシナリオで Hayes が実装したセキュリティ制御を特定します。","c":["ポイントツーポイント通信","MAC認証","DoS対策ソリューション","許可されたRTUおよびPLCコマンドの使用"],"a":[2],"h":"","p":false,"cat":"無線・モバイル・IoT","g":"IoT・OT","x":"産業制御システムのIDMZ境界を強化するセキュリティ制御として、DoS対策ソリューションが該当します。"},{"id":122,"q":"ある組織では、データ アクセスの安全な接続を確保するために、ITインフラストラクチャを複数の部門に分割しました。管理者は、高速データアクセスを提供するために、データをセクションに分割して複数のドライブに保存するPAID レベルを実装しました。この RAIDレベルのストレージ容量は、セット内のディスク容量の合計に等しかったです。\n\n上記のシナリオで管理者が実装した RAID レベルは次のどれですか。","c":["RAID レベル 0","RAID レベル 3","RAID レベル 5","RAID レベル 1"],"a":[0],"h":"","p":false,"cat":"BCP・DR・バックアップ","g":"RAID","x":"データを分割して複数ドライブへ保存し、容量が全ディスクの合計になる=RAID 0(ストライピング、冗長性なし)です。"},{"id":123,"q":"法医学者 Kaisonは、さまざまなオンライン攻撃に使用された侵害されたシステムを調査していました。Kaison はデータ取得プロセスを開始し、システムの DVD-ROMからデータを抽出しました。\n\n上記のシナリオで Kaisonが取得したのは次のどのタイプのデータですか。","c":["アーカイブメディア","カーネル統計","ARPキャッシュ","プロセッサキャッシュ"],"a":[0],"h":"","p":false,"cat":"フォレンジック","g":"データ取得","x":"DVD-ROMなどからデータを取得するのはアーカイブメディアです。揮発性が最も低く、収集は最後です。"},{"id":124,"q":"不満を抱いた従業員が、標的ネットワーク内のマシンの 1 つに RAT (リモート アクセストロイの木馬) サーバーを設置し、企業の機密文書を盗みました。RATがインストールされている標的マシンの IP アドレスは 20.20.10.26 です。Theefクライアントを使用して、「Attacker Machine1」から標的マシンへのリモート接続を開始します。標的マシンの Documentsディレクトリで「Sensitive CorporateDocuments」フォルダを見つけ、ファイルの数を確認します。★\n\nHint: Theefフォルダは、Attacker Machine1 の Z:\\CCT-Tools\\CCT Module 01 Information Security Threats and Vulnerabilities\\Remote Access Trojans (RAT)\\Theef にあります。","c":["2","4","5","3"],"a":[1],"h":"lab1-1\nC:\\Documents\\Users\\Administrator\\Desktop\\\nSensitive Corporate Documents\n\nAttacker Machine1でクライアントTheefを起動し、\n20.20.10.26へログイン。\n「File explorer」の「File Manager」から下記のパス内の\nファイル数を確認。\nSensitive corporate docs.docx\nSensitive corporate docs.pdf\nSensitive corporate docs.txt","p":true,"cat":"実技ラボ","g":"RATクライアント","x":"Q4と同じラボ。TheefでFile Managerから対象フォルダのファイル数を確認します。"},{"id":125,"q":"世界的な金融サービス会社が、さまざまな国際規制の枠組みや法律に準拠するために、サイバーセキュリティポリシーを改訂しています。この会社は複数の大陸で事業を展開しており、各大陸にはデータ保護、プライバシー、サイバーセキュリティに関する独自の法的要件があります。コンプライアンス戦略の一環として、さまざまな規制の枠組みを評価し、どの規制の枠組みが業務に最も重要であるかを判断しています。\n\n会社の国際的な範囲とサービスの性質を考慮すると、次のどの規制の枠組みをコンプライアンスの優先対象とすべきでしょうか。","c":["ISO 27001 情報セキュリティ管理システム","情報セキュリティ管理に関する ISO 27002 実践規範","欧州データ保護規則 (CDPR) - 欧州連合","NIST サイバーセキュリティ フレームワーク"],"a":[2],"h":"","p":false,"cat":"規格・法規・リスク管理","g":"規格・法規の選択","x":"国際的な範囲とサービス性質を考えると、優先すべきはEU一般データ保護規則(GDPR)です。"},{"id":126,"q":"大手ヘルスケア プロバイダーの NovusCorpは、あらゆる潜在的なリスクを確実にカバーできるよう、BC および DR計画を綿密に設計していました。最近、プライマリ データセンターで壊滅的な洪水が発生しました。同社は迅速に DR 計画を発動し、セカンダリデータ センターに業務を移行しました。しかし、24時間以内に、プロバイダーは予期せぬ課題に直面しました。セカンダリ データセンターが、これまでにないほど大量のデータ要求を受信し始め、システムの過負荷と中断を引き起こしたのです。この状況は、プロバイダーの初期リスク評価には含まれていませんでした。\n\nこの苦境に直面して、NovusCorpは、事業継続性を確保するために、直ちにどのような行動を取るべきでしょうか。","c":["増加したデータ要求負荷を処理するために、セカンダリ データセンターのインフラストラクチャをアップグレードするためのリソースを割り当てます。","潜在的なリスクにもかかわらず、プライマリ データセンターへのテールバックを即時に開始します。","プライマリ センターが復旧するまで、一時的なオーバーフローのためにクラウドベースのデータ ストレージ プロバイダーを利用します。","システムの安定性を維持するために、重要でないデータ要求を減らし、データアクセスに一時的な制限を課します。"],"a":[2],"h":"","p":false,"cat":"BCP・DR・バックアップ","g":"障害時の判断","x":"プライマリ復旧までの一時的なオーバーフローをクラウドで吸収するのが、事業継続のための直近の対応です。"},{"id":127,"q":"高度なセキュリティを備えた無線ネットワークを備えた有名な研究機関が最近、高度なサイバー攻撃に遭遇しました。この攻撃は従来のセキュリティ対策では検出されず、大量のデータが流出しました。ワイヤレス ネットワークには WPA3 暗号化、MAC アドレスフィルタリングが装備されており、SSIDブロードキャストは無効になっていました。興味深いことに、攻撃はネットワークパフォーマンスに目立った中断や変化を伴わずに発生しました。徹底的なフォレンジック分析の後、サイバー セキュリティ チームは攻撃方法を特定しました。\n\n次のワイヤレス ネットワーク固有の攻撃のうち、最もよく使用されるのはどれですか?","c":["妨害信号によるネットワーク通信の妨害攻撃","悪意のある双子攻撃。不正なアクセスポイントが正規のアクセスポイントを模倣してネットワークトラフィックをキャプチャする。","ブルースナーフィング。Bluetooth 接続を悪用してネットワーク データにアクセスする","KRACK (キー再インストール攻撃)、WPA2 プロトコルの脆弱性を悪用"],"a":[1],"h":"","p":false,"cat":"無線・モバイル・IoT","g":"無線攻撃","x":"正規アクセスポイントを装う不正APで通信を盗むイビルツイン(悪意のある双子)攻撃は、目立った中断を伴わず発生するため最もよく使われる手口です。"},{"id":128,"q":"Web アプリケーション www.movi​​escope.com は、SQLインジェクション攻撃を受けやすいことが判明しました。Webアプリケーションを悪用してユーザー データを取得することが求められます。moviescopeデータベースで、ユーザー Steve の連絡先番号 (連絡先) を特定します。注: Webアプリケーションにはすでにアカウントがあり、資格情報は sam/test です。(実践的な質問)","c":["1-202-509-7316","1-202-509-7432","1-202-509-7364","1-202-509-8421"],"a":[0],"h":"document.cookie\nsqlmap -u \"http://www.moviescope.com/viewprofile.aspx?id=1\" --cookie=\"クッキー値]\" --dbs\nsqlmap -u \"http://www.moviescope.com/viewprofile.aspx?id=1\" --cookie=\"クッキー値]\" -D moviscope --tables\nsqlmap -u \"http://www.moviescope.com/viewprofile.aspx?id=1\" --cookie=\"クッキー値]\" -D moviscope -T User_Login --dump","p":true,"cat":"実技ラボ","g":"SQLi・プロファイルID","x":"sqlmapで--dbs→--tables→-T User_Login --dumpの順にダンプして連絡先を確認します。"},{"id":129,"q":"ソフトウェア エンジニアの Sam は、ビジネス開発に役立つソフトウェアツールのデモンストレーションを行うために、ある組織を訪問しました。組織の管理者は、システム上に最小限の権限を持つアカウントを作成し、そのシステムを Samにデモンストレーション用に割り当てました。このアカウントを使用すると、Samはデモンストレーションに必要なファイルにのみアクセスでき、システム内の他のファイルを開くことはできません。\n\n上記のシナリオで組織がサムに付与したアカウントの種類は次のどれですか?","c":["サービスアカウント","ゲストアカウント","ユーザーアカウント","管理者アカウント"],"a":[1],"h":"","p":false,"cat":"データ保護・アクセス制御","g":"アカウント種別","x":"デモに必要なファイルにだけアクセスでき、他は開けない一時的・限定的なアカウントはゲストアカウントです。"},{"id":130,"q":"大手金融機関の DigitalVault Corp. では、最近、メインフレーム システムを標的とするAPT(Advanced Persistent Threat)が大幅に増加しています。保存されているデータの機密性を考慮し、攻撃者を欺いて攻撃手法を明かす戦略を採用したいと考えています。防御戦略の一環として、サイバーセキュリティ チームはハニーポットシステムの過剰導入を検討しています。銀行の要件を考慮して、チームはさまざまな種類のハニーポットを評価しています。DigitalVaultの主な目的は、実際のシステムを危険にさらすことなく、攻撃者の手法に関する広範な情報を収集することです。\n\n次のハニーポットのうち、DigitalVaultの目的に最も適しているのはどれですか。","c":["高インタラクションのハニーポット。攻撃者に実際のシステムのレプリカを提供し、攻撃者のあらゆる動きを観察します。","IPアドレスや攻撃ベクトルなどの基本情報を記録するように設計された、低相互作用のハニーポット。","特定の業界に対する脅威を理解し、より広範なコミュニティと洞察を共有することを目的としたハニーポットを調査します。","組織のアクティブネットワークの一部であり、デイリー攻撃に関する情報を収集する実稼働ハニーポット。"],"a":[0],"h":"","p":false,"cat":"検知(IDS)・ログ・SIEM","g":"ハニーポット","x":"実環境を危険にさらさず、攻撃者の手法を広範に集めるには、本物そっくりのレプリカを見せる高インタラクションハニーポットです。"},{"id":131,"q":"デジタル マーケティング エージェンシーである RevoMedia は、オフサイトでクライアントプレゼンテーションを行うことがよくあります。エージェンシーのチームは、モバイルデバイスを使用してさまざまなネットワークに接続し、コンテンツを表示しています。脅威の状況が高まっているため、モバイルデバイスを未
